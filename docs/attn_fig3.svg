<svg viewBox="0 0 940 440" role="img" aria-label="The row-per-block kernel. A block holds one query row and streams K and V through in chunks of Bc rows. Each chunk: dot products into shared, a block max, the rescale factor, exponentials, a block sum, and an accumulate into the per-thread output columns. The score matrix never exists." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="940" height="440" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><rect x="40" y="70" width="56" height="220" rx="0" class="fc3 box" /><text x="68.0" y="62" class="m bold" text-anchor="middle" font-size="12" >Q</text><text x="68.0" y="304" class="m mut" text-anchor="middle" font-size="9" >N x d</text><rect x="130" y="70" width="56" height="220" rx="0" class="fb3 box" /><text x="158.0" y="62" class="m bold" text-anchor="middle" font-size="12" >K</text><text x="158.0" y="304" class="m mut" text-anchor="middle" font-size="9" >N x d</text><rect x="220" y="70" width="56" height="220" rx="0" class="fb3 box" /><text x="248.0" y="62" class="m bold" text-anchor="middle" font-size="12" >V</text><text x="248.0" y="304" class="m mut" text-anchor="middle" font-size="9" >N x d</text><rect x="40" y="166" width="56" height="6" rx="0" class="fc1" /><text x="100" y="171" class="m" text-anchor="start" font-size="9" >row r</text><rect x="130" y="130" width="56" height="34" rx="0" class="fb1" /><rect x="220" y="130" width="56" height="34" rx="0" class="fb1" /><text x="158.0" y="126" class="m" text-anchor="middle" font-size="9" >chunk j: Bc rows</text><rect x="340" y="40" width="380" height="380" rx="6" class="cellb" /><text x="352" y="60" class="m bold" text-anchor="start" font-size="12" >one block = one query row</text><text x="708" y="60" class="m mut" text-anchor="end" font-size="9" >grid = batch * N,  block = max(Bc, d)</text><rect x="354" y="74" width="352" height="30" rx="3" class="fc3 ph" /><text x="362" y="89" class="m bold" text-anchor="start" font-size="10" >q[d] in shared, pre-scaled by 1/sqrt(d)        (once)</text><text x="530.0" y="122" class="m bold" text-anchor="middle" font-size="10" >for chunk j in 0 .. N/Bc - 1:</text><rect x="354" y="132" width="352" height="38" rx="3" class="fb3 ph" /><text x="362" y="147" class="m bold" text-anchor="start" font-size="10" >phase A   threads 0..Bc-1, one key each</text><text x="362" y="161" class="m" text-anchor="start" font-size="9" >s[t] = dot(q, K[chunk*Bc + t])        -&gt; s[Bc] in shared</text><rect x="354" y="176" width="352" height="38" rx="3" class="hlrow ph" /><text x="362" y="191" class="m bold" text-anchor="start" font-size="10" >block max over s[]  -&gt;  m_new = max(m, chunk max)</text><text x="362" y="205" class="m" text-anchor="start" font-size="9" >alpha = exp(m - m_new)          p[t] = exp(s[t] - m_new) -&gt; p[Bc]</text><rect x="354" y="220" width="352" height="30" rx="3" class="hlrow ph" /><text x="362" y="235" class="m bold" text-anchor="start" font-size="10" >block sum over p[]  -&gt;  l = l * alpha + sum</text><rect x="354" y="256" width="352" height="38" rx="3" class="fb3 ph" /><text x="362" y="271" class="m bold" text-anchor="start" font-size="10" >phase B   threads 0..d-1, one output column each</text><text x="362" y="285" class="m" text-anchor="start" font-size="9" >o[k] = o[k] * alpha + sum_t p[t] * V[chunk*Bc + t][k]     (registers)</text><rect x="354" y="300" width="352" height="24" rx="3" class="fc3 ph" /><text x="362" y="315" class="m bold" text-anchor="start" font-size="10" >m = m_new</text><rect x="354" y="332" width="352" height="30" rx="3" class="fc1 ph" /><text x="362" y="347" class="m bold" text-anchor="start" font-size="10" >after the loop:   O[r][k] = o[k] / l</text><path d="M700,358 L714,358 L714,132 L704,132" class="ln" fill="none" marker-end="url(#ar23)"/><text x="716" y="245" class="m mut" text-anchor="middle" font-size="8" transform="rotate(90 716 245)">next chunk</text><path d="M96,169 C 300,169 300,90 336,90" class="ln" fill="none" marker-end="url(#ar23)"/><path d="M186,147.0 C 310,147.0 310,158 336,158" class="ln" fill="none" marker-end="url(#ar23)"/><path d="M276,147.0 C 320,187.0 320,290 336,290" class="ln" fill="none" marker-end="url(#ar23)"/><text x="300" y="84" class="m mut" text-anchor="middle" font-size="9" >q</text><text x="306" y="152" class="m mut" text-anchor="middle" font-size="9" >K chunk</text><text x="306" y="284" class="m mut" text-anchor="middle" font-size="9" >V chunk</text><rect x="800" y="70" width="56" height="220" rx="0" class="fc3 box" /><text x="828.0" y="62" class="m bold" text-anchor="middle" font-size="12" >O</text><text x="828.0" y="304" class="m mut" text-anchor="middle" font-size="9" >N x d</text><rect x="800" y="166" width="56" height="6" rx="0" class="fc1" /><line x1="724" y1="396" x2="796" y2="169" class="ln" marker-end="url(#ar23)" /><text x="760.0" y="152" class="m" text-anchor="middle" font-size="9" >o / l</text><text x="40" y="330" class="m" text-anchor="start" font-size="10" >memory per block: q[d] + s[Bc] + p[Bc] in shared,</text><text x="40" y="346" class="m bold" text-anchor="start" font-size="10" >o[d] in registers. Nothing of size N x N anywhere.</text><text x="40" y="372" class="m mut" text-anchor="start" font-size="10" >cost: every block re-reads all of K and V.</text><text x="40" y="386" class="m mut" text-anchor="start" font-size="10" >That is what tiling Q rows fixes next.</text></svg>