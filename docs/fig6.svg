<svg viewBox="0 0 940 360" role="img" aria-label="Buffer ownership across slabs: each slab reads one buffer and writes the other, alternating. The one barrier between slabs covers both the overwrite hazard and the visibility hazard." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="940" height="360" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="150" y="32" class="m bold" text-anchor="start" font-size="12" >which buffer each slab READS (compute) and WRITES (store slab i+1)</text><text x="142" y="123.0" class="m bold" text-anchor="end" font-size="11" >buf 0</text><text x="142" y="181.0" class="m bold" text-anchor="end" font-size="11" >buf 1</text><rect x="150" y="90" width="100" height="58" rx="0" class="cellb fb2" /><text x="200.0" y="116.0" class="m" text-anchor="middle" font-size="9" >WRITE</text><text x="200.0" y="129.0" class="m mut" text-anchor="middle" font-size="8" >slab 0</text><rect x="150" y="148" width="100" height="58" rx="0" class="cellb" /><text x="200.0" y="181.0" class="m mut" text-anchor="middle" font-size="9" >-</text><text x="200.0" y="82" class="m mut" text-anchor="middle" font-size="9" >prologue</text><text x="325.0" y="82" class="m mut" text-anchor="middle" font-size="9" >slab 0</text><rect x="250" y="90" width="150" height="58" rx="0" class="cellb fa2" /><text x="325.0" y="116.0" class="m" text-anchor="middle" font-size="9" >READ</text><text x="325.0" y="129.0" class="m mut" text-anchor="middle" font-size="8" >compute 0</text><rect x="250" y="148" width="150" height="58" rx="0" class="cellb fb2" /><text x="325.0" y="174.0" class="m" text-anchor="middle" font-size="9" >WRITE</text><text x="325.0" y="187.0" class="m mut" text-anchor="middle" font-size="8" >slab 1</text><text x="475.0" y="82" class="m mut" text-anchor="middle" font-size="9" >slab 1</text><rect x="400" y="90" width="150" height="58" rx="0" class="cellb fb2" /><text x="475.0" y="116.0" class="m" text-anchor="middle" font-size="9" >WRITE</text><text x="475.0" y="129.0" class="m mut" text-anchor="middle" font-size="8" >slab 2</text><rect x="400" y="148" width="150" height="58" rx="0" class="cellb fa2" /><text x="475.0" y="174.0" class="m" text-anchor="middle" font-size="9" >READ</text><text x="475.0" y="187.0" class="m mut" text-anchor="middle" font-size="8" >compute 1</text><text x="625.0" y="82" class="m mut" text-anchor="middle" font-size="9" >slab 2</text><rect x="550" y="90" width="150" height="58" rx="0" class="cellb fa2" /><text x="625.0" y="116.0" class="m" text-anchor="middle" font-size="9" >READ</text><text x="625.0" y="129.0" class="m mut" text-anchor="middle" font-size="8" >compute 2</text><rect x="550" y="148" width="150" height="58" rx="0" class="cellb fb2" /><text x="625.0" y="174.0" class="m" text-anchor="middle" font-size="9" >WRITE</text><text x="625.0" y="187.0" class="m mut" text-anchor="middle" font-size="8" >slab 3</text><text x="775.0" y="82" class="m mut" text-anchor="middle" font-size="9" >slab 3</text><rect x="700" y="90" width="150" height="58" rx="0" class="cellb" /><text x="775.0" y="123.0" class="m mut" text-anchor="middle" font-size="9" >-</text><rect x="700" y="148" width="150" height="58" rx="0" class="cellb fa2" /><text x="775.0" y="174.0" class="m" text-anchor="middle" font-size="9" >READ</text><text x="775.0" y="187.0" class="m mut" text-anchor="middle" font-size="8" >compute 3</text><line x1="250" y1="76" x2="250" y2="220" class="ln2" /><text x="250" y="232" class="m mut" text-anchor="middle" font-size="8" >BAR</text><line x1="400" y1="76" x2="400" y2="220" class="ln2" /><text x="400" y="232" class="m mut" text-anchor="middle" font-size="8" >BAR</text><line x1="550" y1="76" x2="550" y2="220" class="ln2" /><text x="550" y="232" class="m mut" text-anchor="middle" font-size="8" >BAR</text><line x1="700" y1="76" x2="700" y2="220" class="ln2" /><text x="700" y="232" class="m mut" text-anchor="middle" font-size="8" >BAR</text><path d="M362.5,96 C 385.0,60 415.0,60 437.5,96" class="ln" fill="none" marker-end="url(#ar6)"/><text x="400" y="56" class="m" text-anchor="middle" font-size="9" >overwrite hazard</text><path d="M362.5,200 C 385.0,252 415.0,252 437.5,200" class="ln" fill="none" marker-end="url(#ar6)"/><text x="400" y="266" class="m" text-anchor="middle" font-size="9" >visibility hazard</text><text x="150" y="290" class="m" text-anchor="start" font-size="10" >Both arrows cross the same barrier. It guarantees:</text><text x="150" y="306" class="m mut" text-anchor="start" font-size="10" >  every read of buf 0 in slab 0 finished   -&gt;  slab 1 may overwrite it</text><text x="150" y="320" class="m mut" text-anchor="start" font-size="10" >  every write to buf 1 in slab 0 is visible  -&gt;  slab 1 may read it</text><text x="150" y="340" class="m" text-anchor="start" font-size="10" >A single buffer needs a second barrier between READ and WRITE of the SAME buffer.</text></svg>