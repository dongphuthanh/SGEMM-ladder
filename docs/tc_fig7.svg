<svg viewBox="0 0 1110 681" role="img" aria-label="Two rows of six steps for one warp and one chunk. Before, in the FP32 kernel, each lane computes its 4 by 4 scores with 1024 FFMA straight into registers, does the softmax, rescales o in registers, writes P over Ks, and computes P times V with 1024 FFMA into registers. After, in the FP16 tensor-core kernel, the whole warp computes S with 8 mma_sync, stores it to shared memory and each lane reads its scores back; the softmax code is identical; O is rescaled in shared memory; P is written as half over Ss; and P times V is 8 mma_sync with O loaded from and stored back to shared memory." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="1110" height="681" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="26" class="m bold" text-anchor="start" font-size="13" >one warp, one chunk (16 query rows x 32 keys): before and after tensor cores</text><text x="20" y="44" class="m mut" text-anchor="start" font-size="10" >same rows (warpId*16 .. +15), same lanes (startRow + i), same 6 steps -- only who multiplies, and where S and O live, changes</text><text x="225.0" y="72" class="m bold" text-anchor="middle" font-size="10.5" >1  load K, V</text><text x="395.0" y="72" class="m bold" text-anchor="middle" font-size="10.5" >2  S = Q . K^T</text><text x="575.0" y="72" class="m bold" text-anchor="middle" font-size="10.5" >3  softmax</text><text x="722.5" y="72" class="m bold" text-anchor="middle" font-size="10.5" >4  rescale O</text><text x="850.0" y="72" class="m bold" text-anchor="middle" font-size="10.5" >5  write P</text><text x="1002.5" y="72" class="m bold" text-anchor="middle" font-size="10.5" >6  O += P . V</text><rect x="14" y="84" width="1082" height="160" rx="6" class="cellb" /><rect x="14" y="268" width="1082" height="200" rx="6" class="cellb" /><text x="24" y="106" class="m bold" text-anchor="start" font-size="12" >before</text><text x="24" y="122" class="m mut" text-anchor="start" font-size="9" >online_attn.cu</text><text x="24" y="136" class="m mut" text-anchor="start" font-size="9" >FP32, CUDA cores</text><text x="24" y="290" class="m bold" text-anchor="start" font-size="12" >after</text><text x="24" y="306" class="m mut" text-anchor="start" font-size="9" >tc_attn.cu</text><text x="24" y="320" class="m mut" text-anchor="start" font-size="9" >FP16, tensor cores</text><rect x="160" y="98" width="130" height="132" rx="4" class="fb2 f4" /><text x="225.0" y="147.0" class="m bold" text-anchor="middle" font-size="9.5" >all 128 threads</text><text x="225.0" y="161.0" class="m" text-anchor="middle" font-size="9.5" >Ks[startCol+j][row]</text><text x="225.0" y="175.0" class="m" text-anchor="middle" font-size="9.5" >(transposed)</text><text x="225.0" y="189.0" class="m" text-anchor="middle" font-size="9.5" >float</text><rect x="300" y="98" width="190" height="132" rx="4" class="fa2 f4" /><text x="395.0" y="133.0" class="m bold" text-anchor="middle" font-size="9.5" >each lane, h loop:</text><text x="395.0" y="147.0" class="m" text-anchor="middle" font-size="9.5" >reads Qs + Ks (float4)</text><text x="395.0" y="161.0" class="m" text-anchor="middle" font-size="9.5" >1,024 FFMA</text><text x="395.0" y="175.0" class="m" text-anchor="middle" font-size="9.5" ></text><text x="395.0" y="189.0" class="m" text-anchor="middle" font-size="9.5" >s[4][4] lands in</text><text x="395.0" y="203.0" class="m" text-anchor="middle" font-size="9.5" >its registers</text><rect x="500" y="98" width="150" height="132" rx="4" class="fa2 f4" /><text x="575.0" y="140.0" class="m" text-anchor="middle" font-size="9.5" >mask, rmax</text><text x="575.0" y="154.0" class="m" text-anchor="middle" font-size="9.5" >3 shuffles</text><text x="575.0" y="168.0" class="m" text-anchor="middle" font-size="9.5" >m_new, alpha, exp2f</text><text x="575.0" y="182.0" class="m" text-anchor="middle" font-size="9.5" >rsum, 3 shuffles</text><text x="575.0" y="196.0" class="m" text-anchor="middle" font-size="9.5" >l</text><rect x="660" y="98" width="125" height="132" rx="4" class="fa2 f4" /><text x="722.5" y="147.0" class="m bold" text-anchor="middle" font-size="9.5" >o[4][8]</text><text x="722.5" y="161.0" class="m" text-anchor="middle" font-size="9.5" >*= alpha</text><text x="722.5" y="175.0" class="m" text-anchor="middle" font-size="9.5" ></text><text x="722.5" y="189.0" class="m" text-anchor="middle" font-size="9.5" >registers</text><rect x="795" y="98" width="110" height="132" rx="4" class="fb2 f4" /><text x="850.0" y="140.0" class="m bold" text-anchor="middle" font-size="9.5" >Ps (over Ks)</text><text x="850.0" y="154.0" class="m" text-anchor="middle" font-size="9.5" >float</text><text x="850.0" y="168.0" class="m" text-anchor="middle" font-size="9.5" ></text><text x="850.0" y="182.0" class="m" text-anchor="middle" font-size="9.5" >Ps[startRow+i]</text><text x="850.0" y="196.0" class="m" text-anchor="middle" font-size="9.5" >[laneCol*4+j]</text><rect x="915" y="98" width="175" height="132" rx="4" class="fa2 f4" /><text x="1002.5" y="133.0" class="m bold" text-anchor="middle" font-size="9.5" >each lane:</text><text x="1002.5" y="147.0" class="m" text-anchor="middle" font-size="9.5" >reads Ps + Vs (float4)</text><text x="1002.5" y="161.0" class="m" text-anchor="middle" font-size="9.5" >1,024 FFMA</text><text x="1002.5" y="175.0" class="m" text-anchor="middle" font-size="9.5" ></text><text x="1002.5" y="189.0" class="m" text-anchor="middle" font-size="9.5" >into o[4][8]</text><text x="1002.5" y="203.0" class="m" text-anchor="middle" font-size="9.5" >(registers)</text><rect x="160" y="282" width="130" height="172" rx="4" class="fb2 f4" /><text x="225.0" y="344.0" class="m bold" text-anchor="middle" font-size="9.5" >all 128 threads</text><text x="225.0" y="358.0" class="m" text-anchor="middle" font-size="9.5" >Ks[row][startCol+j]</text><text x="225.0" y="372.0" class="m" text-anchor="middle" font-size="9.5" >(natural: col_major</text><text x="225.0" y="386.0" class="m" text-anchor="middle" font-size="9.5" >does the transpose)</text><text x="225.0" y="400.0" class="m" text-anchor="middle" font-size="9.5" >half</text><rect x="300" y="282" width="190" height="52.0" rx="4" class="fc2 f4" /><text x="395.0" y="305.0" class="m bold" text-anchor="middle" font-size="9.5" >whole warp: 8 mma_sync</text><text x="395.0" y="319.0" class="m" text-anchor="middle" font-size="9.5" >qa[4] (regs) x Ks frags</text><rect x="300" y="342.0" width="190" height="52.0" rx="4" class="fb2 f4" /><text x="395.0" y="365.0" class="m bold" text-anchor="middle" font-size="9.5" >store_matrix_sync</text><text x="395.0" y="379.0" class="m" text-anchor="middle" font-size="9.5" >-&gt; Ss strip (16 x 32)</text><rect x="300" y="402.0" width="190" height="52.0" rx="4" class="fa2 f4" /><text x="395.0" y="425.0" class="m bold" text-anchor="middle" font-size="9.5" >each lane reads its</text><text x="395.0" y="439.0" class="m" text-anchor="middle" font-size="9.5" >s[4][4] back from Ss</text><line x1="395" y1="334.0" x2="395" y2="341.0" class="ln" marker-end="url(#ar37)" /><line x1="395" y1="394.0" x2="395" y2="401.0" class="ln" marker-end="url(#ar37)" /><rect x="500" y="282" width="150" height="172" rx="4" class="fa2 f4" /><text x="575.0" y="344.0" class="m" text-anchor="middle" font-size="9.5" >mask, rmax</text><text x="575.0" y="358.0" class="m" text-anchor="middle" font-size="9.5" >3 shuffles</text><text x="575.0" y="372.0" class="m" text-anchor="middle" font-size="9.5" >m_new, alpha, exp2f</text><text x="575.0" y="386.0" class="m" text-anchor="middle" font-size="9.5" >rsum, 3 shuffles</text><text x="575.0" y="400.0" class="m" text-anchor="middle" font-size="9.5" >l</text><rect x="660" y="282" width="125" height="172" rx="4" class="fb2 f4" /><text x="722.5" y="337.0" class="m bold" text-anchor="middle" font-size="9.5" >Os[startRow+i]</text><text x="722.5" y="351.0" class="m" text-anchor="middle" font-size="9.5" >[...] *= alpha</text><text x="722.5" y="365.0" class="m" text-anchor="middle" font-size="9.5" ></text><text x="722.5" y="379.0" class="m" text-anchor="middle" font-size="9.5" >shared memory</text><text x="722.5" y="393.0" class="m" text-anchor="middle" font-size="9.5" >(32 read-</text><text x="722.5" y="407.0" class="m" text-anchor="middle" font-size="9.5" >modify-writes)</text><rect x="795" y="282" width="110" height="172" rx="4" class="fb2 f4" /><text x="850.0" y="344.0" class="m bold" text-anchor="middle" font-size="9.5" >Ps (over Ss)</text><text x="850.0" y="358.0" class="m" text-anchor="middle" font-size="9.5" >half</text><text x="850.0" y="372.0" class="m" text-anchor="middle" font-size="9.5" ></text><text x="850.0" y="386.0" class="m" text-anchor="middle" font-size="9.5" >Ps[startRow+i]</text><text x="850.0" y="400.0" class="m" text-anchor="middle" font-size="9.5" >[laneCol*4+j]</text><rect x="915" y="282" width="175" height="52.0" rx="4" class="fb2 f4" /><text x="1002.5" y="305.0" class="m bold" text-anchor="middle" font-size="9.5" >load pa[2] from Ps,</text><text x="1002.5" y="319.0" class="m" text-anchor="middle" font-size="9.5" >Os tiles, Vs frags</text><rect x="915" y="342.0" width="175" height="52.0" rx="4" class="fc2 f4" /><text x="1002.5" y="365.0" class="m bold" text-anchor="middle" font-size="9.5" >whole warp: 8 mma_sync</text><text x="1002.5" y="379.0" class="m" text-anchor="middle" font-size="9.5" >Os += pa x Vs</text><rect x="915" y="402.0" width="175" height="52.0" rx="4" class="fb2 f4" /><text x="1002.5" y="425.0" class="m bold" text-anchor="middle" font-size="9.5" >store_matrix_sync</text><text x="1002.5" y="439.0" class="m" text-anchor="middle" font-size="9.5" >-&gt; Os</text><line x1="1002" y1="334.0" x2="1002" y2="341.0" class="ln" marker-end="url(#ar37)" /><line x1="1002" y1="394.0" x2="1002" y2="401.0" class="ln" marker-end="url(#ar37)" /><rect x="512" y="238" width="126" height="30" rx="4" class="barw" /><text x="575" y="257" class="m bold" text-anchor="middle" font-size="10" >identical code</text><rect x="20" y="484" width="14" height="14" rx="0" class="fa2 f4" /><text x="40" y="495" class="m" text-anchor="start" font-size="10" >per-lane work on CUDA cores (registers)</text><rect x="301.8" y="484" width="14" height="14" rx="0" class="fc2 f4" /><text x="321.8" y="495" class="m" text-anchor="start" font-size="10" >tensor cores (whole warp)</text><rect x="496.8" y="484" width="14" height="14" rx="0" class="fb2 f4" /><text x="516.8" y="495" class="m" text-anchor="start" font-size="10" >shared-memory traffic</text><text x="24" y="522" class="m bold" text-anchor="start" font-size="10" >per chunk, one warp</text><text x="230" y="522" class="m bold" text-anchor="start" font-size="10" >before</text><text x="520" y="522" class="m bold" text-anchor="start" font-size="10" >after</text><text x="24" y="539" class="m " text-anchor="start" font-size="10" >multiply-adds</text><text x="230" y="539" class="m " text-anchor="start" font-size="10" >65,536</text><text x="520" y="539" class="m " text-anchor="start" font-size="10" >65,536</text><text x="24" y="556" class="m " text-anchor="start" font-size="10" >math instructions</text><text x="230" y="556" class="m " text-anchor="start" font-size="10" >2,048 FFMA per lane</text><text x="520" y="556" class="m " text-anchor="start" font-size="10" >16 mma_sync for the warp</text><text x="24" y="573" class="m " text-anchor="start" font-size="10" >Q</text><text x="230" y="573" class="m " text-anchor="start" font-size="10" >re-read from Qs every chunk</text><text x="520" y="573" class="m " text-anchor="start" font-size="10" >4 fragments in registers, loaded once</text><text x="24" y="590" class="m " text-anchor="start" font-size="10" >S</text><text x="230" y="590" class="m " text-anchor="start" font-size="10" >straight into registers</text><text x="520" y="590" class="m " text-anchor="start" font-size="10" >tensor cores -&gt; Ss -&gt; registers</text><text x="24" y="607" class="m " text-anchor="start" font-size="10" >O</text><text x="230" y="607" class="m " text-anchor="start" font-size="10" >o[4][8] in registers</text><text x="520" y="607" class="m " text-anchor="start" font-size="10" >Os in shared: scaled, loaded, stored each chunk</text><text x="24" y="624" class="m " text-anchor="start" font-size="10" >registers / lane</text><text x="230" y="624" class="m " text-anchor="start" font-size="10" >95</text><text x="520" y="624" class="m " text-anchor="start" font-size="10" >72</text><text x="24" y="651" class="m bold" text-anchor="start" font-size="10" >The math got 128x fewer instructions; the price is S and O leaving the registers every chunk, because a WMMA fragment</text><text x="24" y="667" class="m bold" text-anchor="start" font-size="10" >doesn't say which row each element is in -- and the softmax and the alpha rescale need rows. mma.sync would keep them in registers.</text></svg>