<svg viewBox="0 0 960 565" role="img" aria-label="One thread block owns a 128 by 128 tile of C. For each 8-wide slab along K it loads a 128 by 8 piece of A and an 8 by 128 piece of B into shared memory." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="960" height="565" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><rect x="360" y="40" width="200" height="200" rx="0" class="fb3 box" /><rect x="90" y="280" width="200" height="200" rx="0" class="fa3 box" /><rect x="360" y="280" width="200" height="200" rx="0" class="fc3 box" /><rect x="90" y="330" width="200" height="50" rx="0" class="fa2" /><rect x="150" y="330" width="10" height="50" rx="0" class="fa1" /><rect x="460" y="40" width="50" height="200" rx="0" class="fb2" /><rect x="460" y="100" width="50" height="10" rx="0" class="fb1" /><rect x="460" y="330" width="50" height="50" rx="0" class="fc1" /><line x1="410" y1="40" x2="410" y2="240" class="blk" /><line x1="360" y1="90" x2="560" y2="90" class="blk" /><line x1="140" y1="280" x2="140" y2="480" class="blk" /><line x1="90" y1="330" x2="290" y2="330" class="blk" /><line x1="410" y1="280" x2="410" y2="480" class="blk" /><line x1="360" y1="330" x2="560" y2="330" class="blk" /><line x1="460" y1="40" x2="460" y2="240" class="blk" /><line x1="360" y1="140" x2="560" y2="140" class="blk" /><line x1="190" y1="280" x2="190" y2="480" class="blk" /><line x1="90" y1="380" x2="290" y2="380" class="blk" /><line x1="460" y1="280" x2="460" y2="480" class="blk" /><line x1="360" y1="380" x2="560" y2="380" class="blk" /><line x1="510" y1="40" x2="510" y2="240" class="blk" /><line x1="360" y1="190" x2="560" y2="190" class="blk" /><line x1="240" y1="280" x2="240" y2="480" class="blk" /><line x1="90" y1="430" x2="290" y2="430" class="blk" /><line x1="510" y1="280" x2="510" y2="480" class="blk" /><line x1="360" y1="430" x2="560" y2="430" class="blk" /><text x="368" y="58" class="m bold" text-anchor="start" font-size="15" >B</text><text x="552" y="58" class="m mut" text-anchor="end" font-size="11" >K x N</text><text x="98" y="298" class="m bold" text-anchor="start" font-size="15" >A</text><text x="282" y="298" class="m mut" text-anchor="end" font-size="11" >M x K</text><text x="368" y="298" class="m bold" text-anchor="start" font-size="15" >C</text><text x="552" y="298" class="m mut" text-anchor="end" font-size="11" >M x N</text><text x="80" y="384.0" class="m mut" text-anchor="end" font-size="11" >M = 512</text><text x="190.0" y="496" class="m mut" text-anchor="middle" font-size="11" >K = 512</text><text x="350" y="144.0" class="m mut" text-anchor="end" font-size="11" >K = 512</text><text x="460.0" y="30" class="m mut" text-anchor="middle" font-size="11" >N = 512</text><text x="460.0" y="496" class="m mut" text-anchor="middle" font-size="11" >N = 512</text><text x="94" y="344" class="m" text-anchor="start" font-size="9" >row band</text><text x="94" y="356" class="m" text-anchor="start" font-size="9" >BM = 128</text><text x="485.0" y="254" class="m" text-anchor="middle" font-size="11" >col band, BN = 128</text><text x="485.0" y="353.0" class="m on1" text-anchor="middle" font-size="10" >128</text><text x="485.0" y="365.0" class="m on1" text-anchor="middle" font-size="10" >x 128</text><text x="485.0" y="394" class="m" text-anchor="middle" font-size="9" >this block's tile</text><text x="485.0" y="406" class="m mut" text-anchor="middle" font-size="9" >(bx=2, by=1)</text><line x1="155.0" y1="510" x2="155.0" y2="383" class="ln" marker-end="url(#ar1)" /><text x="155.0" y="524" class="m" text-anchor="middle" font-size="10" >slab i: BK = 8 cols</text><line x1="430" y1="105.0" x2="457" y2="105.0" class="ln" marker-end="url(#ar1)" /><text x="426" y="109.0" class="m" text-anchor="end" font-size="10" >slab i: BK = 8 rows</text><rect x="680" y="100" width="256" height="32" rx="0" class="fb2 box" /><rect x="680" y="100" width="16" height="32" rx="0" class="fb1" /><text x="680" y="92" class="m bold" text-anchor="start" font-size="12" >Bs[8][128]</text><text x="674" y="120.0" class="m mut" text-anchor="end" font-size="10" >8</text><text x="808.0" y="146" class="m mut" text-anchor="middle" font-size="10" >128   (k down, C-col across)</text><rect x="680" y="300" width="256" height="32" rx="0" class="fa2 box" /><rect x="680" y="300" width="16" height="32" rx="0" class="fa1" /><text x="680" y="292" class="m bold" text-anchor="start" font-size="12" >As[8][128] transposed</text><text x="674" y="320.0" class="m mut" text-anchor="end" font-size="10" >8</text><text x="808.0" y="346" class="m mut" text-anchor="middle" font-size="10" >128   (k down, C-row across)</text><text x="808.0" y="360" class="m" text-anchor="middle" font-size="10" >same 8 x 128 shape as Bs</text><path d="M510,105.0 C 600,105.0 600,116.0 676,116.0" class="ln" fill="none" marker-end="url(#ar1)"/><text x="600" y="70" class="m" text-anchor="middle" font-size="10" >1 float4 load / thread</text><text x="600" y="82" class="m mut" text-anchor="middle" font-size="10" >straight store</text><path d="M160,355.0 L318,355.0 Q328,355.0 328,365.0 L328,505 Q328,515 338,515 L650,515 Q660,515 660,505 L660,326.0 Q660,316.0 670,316.0 L676,316.0" class="ln" fill="none" marker-end="url(#ar1)"/><text x="494" y="506" class="m" text-anchor="middle" font-size="10" >1 float4 load / thread   -   scatter-store = transpose</text><text x="90" y="548" class="m mut" text-anchor="start" font-size="10" >for i in 0 .. K/BK-1:  slab slides along K in A, down K in B</text></svg>