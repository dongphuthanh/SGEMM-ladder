<svg viewBox="0 0 1010 476" role="img" aria-label="Left: a 128 by 128 block tile of C split into 8 warp tiles of 64 by 32, with the A slab of 128 by 16 and B slab of 16 by 128 in shared memory, split into two 8-deep k steps. Right: one warp tile is 4 by 2 accumulator fragments of 16 by 16; per k step the warp loads 4 A fragments of 16 by 8 and 2 B fragments of 8 by 16 and issues 8 mma_sync calls." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="1010" height="476" fill="#FFFFFF"/><style>
