.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="26" class="m bold" text-anchor="start" font-size="13" >TF32 GEMM: block tile -&gt; warp tile -&gt; 16x16 fragments</text><rect x="112" y="70" width="256" height="32" rx="0" class="cellb" /><rect x="240" y="70" width="64" height="32" rx="0" class="fb2" /><line x1="112" y1="86" x2="368" y2="86" class="ln2" /><rect x="112" y="70" width="256" height="32" rx="0" class="box" /><rect x="62" y="112" width="32" height="256" rx="0" class="cellb" /><rect x="62" y="240" width="32" height="128" rx="0" class="fc2" /><line x1="78" y1="112" x2="78" y2="368" class="ln2" /><rect x="62" y="112" width="32" height="256" rx="0" class="box" /><rect x="112" y="112" width="256" height="256" rx="0" class="cellb" /><rect x="240" y="240" width="64" height="128" rx="0" class="fa2" /><line x1="176" y1="112" x2="176" y2="368" class="tick" /><line x1="240" y1="112" x2="240" y2="368" class="tick" /><line x1="304" y1="112" x2="304" y2="368" class="tick" /><line x1="112" y1="240" x2="368" y2="240" class="tick" /><text x="144" y="180" class="m mut" text-anchor="middle" font-size="9" >warp 0</text><text x="208" y="180" class="m mut" text-anchor="middle" font-size="9" >warp 1</text><text x="272" y="180" class="m mut" text-anchor="middle" font-size="9" >warp 2</text><text x="336" y="180" class="m mut" text-anchor="middle" font-size="9" >warp 3</text><text x="144" y="308" class="m mut" text-anchor="middle" font-size="9" >warp 4</text><text x="208" y="308" class="m mut" text-anchor="middle" font-size="9" >warp 5</text><text x="272" y="308" class="m bold" text-anchor="middle" font-size="9" >warp 6</text><text x="336" y="308" class="m mut" text-anchor="middle" font-size="9" >warp 7</text><rect x="112" y="112" width="256" height="256" rx="0" class="box" /><text x="104" y="90" class="m bold" text-anchor="end" font-size="10" >Bs 16x128</text><text x="78" y="384" class="m bold" text-anchor="middle" font-size="10" >As 128x16</text><text x="78" y="398" class="m mut" text-anchor="middle" font-size="9" >(not transposed)</text><text x="240" y="384" class="m bold" text-anchor="middle" font-size="10" >C block tile 128x128</text><text x="240" y="398" class="m mut" text-anchor="middle" font-size="9" >8 warps as 2 x 4, each 64x32</text><text x="70" y="124" class="m mut" text-anchor="middle" font-size="8" >0</text><text x="86" y="124" class="m mut" text-anchor="middle" font-size="8" >8</text><text x="58" y="124" class="m mut" text-anchor="end" font-size="8" >kk</text><text x="374" y="81" class="m mut" text-anchor="start" font-size="8" >kk=0</text><text x="374" y="97" class="m mut" text-anchor="start" font-size="8" >kk=8</text><line x1="308" y1="340" x2="600" y2="278" class="ln" marker-end="url(#ar32)" /><text x="420" y="76" class="m bold" text-anchor="start" font-size="11" >zoom: warp 6 (warpRow 1, warpCol 2) for one 8-deep k step</text><rect x="690" y="108" width="64" height="32" rx="0" class="fb2 box" /><text x="722" y="128" class="m bold" text-anchor="middle" font-size="10" >b[0]  8x16</text><rect x="754" y="108" width="64" height="32" rx="0" class="fb2 box" /><text x="786" y="128" class="m bold" text-anchor="middle" font-size="10" >b[1]  8x16</text><rect x="648" y="150" width="32" height="64" rx="0" class="fc2 box" /><text x="664" y="186" class="m bold" text-anchor="middle" font-size="10" >a[0]</text><rect x="648" y="214" width="32" height="64" rx="0" class="fc2 box" /><text x="664" y="250" class="m bold" text-anchor="middle" font-size="10" >a[1]</text><rect x="648" y="278" width="32" height="64" rx="0" class="fc2 box" /><text x="664" y="314" class="m bold" text-anchor="middle" font-size="10" >a[2]</text><rect x="648" y="342" width="32" height="64" rx="0" class="fc2 box" /><text x="664" y="378" class="m bold" text-anchor="middle" font-size="10" >a[3]</text><text x="664" y="142" class="m mut" text-anchor="middle" font-size="9" >16x8 each</text><rect x="690" y="150" width="64" height="64" rx="0" class="fa2 box" /><text x="722" y="186" class="m bold" text-anchor="middle" font-size="10" >acc[0][0]</text><rect x="754" y="150" width="64" height="64" rx="0" class="fa2 box" /><text x="786" y="186" class="m bold" text-anchor="middle" font-size="10" >acc[0][1]</text><rect x="690" y="214" width="64" height="64" rx="0" class="fa2 box" /><text x="722" y="250" class="m bold" text-anchor="middle" font-size="10" >acc[1][0]</text><rect x="754" y="214" width="64" height="64" rx="0" class="fa2 box" /><text x="786" y="250" class="m bold" text-anchor="middle" font-size="10" >acc[1][1]</text><rect x="690" y="278" width="64" height="64" rx="0" class="fa2 box" /><text x="722" y="314" class="m bold" text-anchor="middle" font-size="10" >acc[2][0]</text><rect x="754" y="278" width="64" height="64" rx="0" class="fa2 box" /><text x="786" y="314" class="m bold" text-anchor="middle" font-size="10" >acc[2][1]</text><rect x="690" y="342" width="64" height="64" rx="0" class="fa2 box" /><text x="722" y="378" class="m bold" text-anchor="middle" font-size="10" >acc[3][0]</text><rect x="754" y="342" width="64" height="64" rx="0" class="fa2 box" /><text x="786" y="378" class="m bold" text-anchor="middle" font-size="10" >acc[3][1]</text><text x="754" y="420" class="m bold" text-anchor="middle" font-size="10" >warp tile 64x32 = 4x2 fragments of 16x16</text><text x="836" y="156" class="m bold" text-anchor="start" font-size="10" >per 8-deep k step:</text><text x="836" y="172" class="m " text-anchor="start" font-size="10" >  load 4 a + 2 b fragments</text><text x="836" y="188" class="m " text-anchor="start" font-size="10" >  convert them to TF32</text><text x="836" y="204" class="m " text-anchor="start" font-size="10" >  8 mma_sync:</text><text x="836" y="220" class="m " text-anchor="start" font-size="10" >  acc[i][j] += a[i] . b[j]</text><text x="836" y="236" class="m " text-anchor="start" font-size="10" ></text><text x="836" y="252" class="m " text-anchor="start" font-size="10" >per BK=16 slab: 2 steps</text><text x="836" y="268" class="m " text-anchor="start" font-size="10" ></text><text x="836" y="284" class="m bold" text-anchor="start" font-size="10" >acc = 8 fragments x</text><text x="836" y="300" class="m bold" text-anchor="start" font-size="10" >  8 floats = 64 regs/lane</text><text x="836" y="316" class="m " text-anchor="start" font-size="10" >  -- same count as the</text><text x="836" y="332" class="m " text-anchor="start" font-size="10" >  SIMT 8x8 tile per thread</text><text x="420" y="440" class="m" text-anchor="start" font-size="10" >a[i]: As rows warpRow*64 + i*16 .. +15, cols kk .. kk+7</text><text x="420" y="456" class="m" text-anchor="start" font-size="10" >b[j]: Bs rows kk .. kk+7, cols warpCol*32 + j*16 .. +15</text></svg>