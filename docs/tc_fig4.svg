<svg viewBox="0 0 1040 480" role="img" aria-label="Swimlane diagram of one warp processing one chunk. Registers hold the Q fragments, the S accumulator fragments, the per-row m, l and alpha, and the P fragments. Tensor cores compute S = Q times K transpose and O += P times V, 16 mma each. Shared memory holds the K and V chunks, the warp's 16 by 32 S strip which becomes P in place, and the warp's 16 by 64 O accumulator strip, which is rescaled per row, loaded as an accumulator, and stored back." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="1040" height="480" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="26" class="m bold" text-anchor="start" font-size="13" >tensor-core attention: one warp, one chunk  (warp owns 16 query rows; chunk = 32 keys)</text><rect x="20" y="60" width="1010" height="90" rx="4" class="fa3" /><text x="30" y="80" class="m bold" text-anchor="start" font-size="11" >registers</text><text x="30" y="95" class="m mut" text-anchor="start" font-size="9" >per lane</text><rect x="20" y="160" width="1010" height="80" rx="4" class="fc3" /><text x="30" y="180" class="m bold" text-anchor="start" font-size="11" >tensor cores</text><text x="30" y="195" class="m mut" text-anchor="start" font-size="9" >mma_sync</text><rect x="20" y="250" width="1010" height="130" rx="4" class="fb3" /><text x="30" y="270" class="m bold" text-anchor="start" font-size="11" >shared memory</text><rect x="130" y="72" width="130" height="64" rx="4" class="fa2 f4" /><text x="195.0" y="89" class="m bold" text-anchor="middle" font-size="9.5" >qa[8]</text><text x="195.0" y="103" class="m " text-anchor="middle" font-size="9.5" >Q fragments</text><text x="195.0" y="117" class="m " text-anchor="middle" font-size="9.5" >loaded once,</text><text x="195.0" y="131" class="m " text-anchor="middle" font-size="9.5" >kept all kernel</text><rect x="410" y="80" width="100" height="50" rx="4" class="fa2 f4" /><text x="460.0" y="97" class="m bold" text-anchor="middle" font-size="9.5" >s[2]</text><text x="460.0" y="111" class="m " text-anchor="middle" font-size="9.5" >accum 16x32</text><rect x="540" y="72" width="140" height="64" rx="4" class="fa2 f4" /><text x="610.0" y="89" class="m bold" text-anchor="middle" font-size="9.5" >m, l, alpha</text><text x="610.0" y="103" class="m " text-anchor="middle" font-size="9.5" >one row per 2 lanes</text><text x="610.0" y="117" class="m " text-anchor="middle" font-size="9.5" >shfl_xor(.., 1)</text><rect x="720" y="80" width="110" height="50" rx="4" class="fa2 f4" /><text x="775.0" y="97" class="m bold" text-anchor="middle" font-size="9.5" >pa[4]</text><text x="775.0" y="111" class="m " text-anchor="middle" font-size="9.5" >P fragments</text><rect x="270" y="172" width="120" height="56" rx="4" class="fc2 f4" /><text x="330.0" y="189" class="m bold" text-anchor="middle" font-size="9.5" >S = Q . K^T</text><text x="330.0" y="203" class="m " text-anchor="middle" font-size="9.5" >2 x 8 = 16 mma</text><rect x="880" y="172" width="140" height="56" rx="4" class="fc2 f4" /><text x="950.0" y="189" class="m bold" text-anchor="middle" font-size="9.5" >O += P . V</text><text x="950.0" y="203" class="m " text-anchor="middle" font-size="9.5" >4 x 4 = 16 mma</text><rect x="130" y="262" width="130" height="48" rx="4" class="fb2 f4" /><text x="195.0" y="279" class="m bold" text-anchor="middle" font-size="9.5" >Ks  32 x 68</text><text x="195.0" y="293" class="m " text-anchor="middle" font-size="9.5" >keys as rows</text><rect x="130" y="318" width="130" height="48" rx="4" class="fb2 f4" /><text x="195.0" y="335" class="m bold" text-anchor="middle" font-size="9.5" >Vs  32 x 68</text><text x="195.0" y="349" class="m " text-anchor="middle" font-size="9.5" >row_major</text><rect x="400" y="280" width="220" height="64" rx="4" class="fb2 f4" /><text x="510.0" y="297" class="m bold" text-anchor="middle" font-size="9.5" >Ss strip  16 x 32</text><text x="510.0" y="311" class="m " text-anchor="middle" font-size="9.5" >S, then P in place</text><text x="510.0" y="325" class="m " text-anchor="middle" font-size="9.5" >(this warp's rows only)</text><rect x="700" y="280" width="200" height="64" rx="4" class="fb2 f4" /><text x="800.0" y="297" class="m bold" text-anchor="middle" font-size="9.5" >QO strip  16 x 64</text><text x="800.0" y="311" class="m " text-anchor="middle" font-size="9.5" >O accumulator; its rows</text><text x="800.0" y="325" class="m " text-anchor="middle" font-size="9.5" >are scaled by alpha</text><line x1="250" y1="104" x2="300" y2="170" class="ln" marker-end="url(#ar34)" /><line x1="260" y1="286" x2="300" y2="230" class="ln" marker-end="url(#ar34)" /><text x="278" y="250" class="m bold" text-anchor="end" font-size="9" >col_major</text><line x1="390" y1="190" x2="418" y2="132" class="ln" marker-end="url(#ar34)" /><line x1="450" y1="132" x2="450" y2="278" class="ln" marker-end="url(#ar34)" /><text x="444" y="258" class="m" text-anchor="end" font-size="9" >store_matrix_sync</text><line x1="540" y1="278" x2="560" y2="140" class="ln" marker-end="url(#ar34)" /><text x="542" y="222" class="m" text-anchor="end" font-size="9" >read row</text><line x1="640" y1="140" x2="595" y2="278" class="ln" marker-end="url(#ar34)" /><text x="624" y="222" class="m" text-anchor="start" font-size="9" >write P</text><line x1="615" y1="278" x2="740" y2="132" class="ln" marker-end="url(#ar34)" /><text x="686" y="222" class="m" text-anchor="start" font-size="9" >load as matrix_a</text><line x1="830" y1="110" x2="890" y2="170" class="ln" marker-end="url(#ar34)" /><path d="M 260 342 L 280 342 L 280 392 L 1010 392 L 1010 232" class="ln" fill="none" marker-end="url(#ar34)"/><text x="620" y="405" class="m" text-anchor="start" font-size="9" >Vs (row_major)</text><line x1="850" y1="278" x2="905" y2="232" class="ln" marker-end="url(#ar34)" /><text x="856" y="258" class="m" text-anchor="end" font-size="9" >load acc</text><line x1="990" y1="232" x2="895" y2="278" class="ln" marker-end="url(#ar34)" /><text x="958" y="268" class="m" text-anchor="start" font-size="9" >store</text><text x="30" y="432" class="m" text-anchor="start" font-size="10" >Only 2 block-wide barriers per chunk (__syncthreads around the K/V load): S, P and O rows belong to exactly one warp,</text><text x="30" y="448" class="m" text-anchor="start" font-size="10" >so the steps inside a warp only need __syncwarp().  S and O go through shared memory because the row max and the</text><text x="30" y="464" class="m" text-anchor="start" font-size="10" >per-row alpha need each element's row -- which a fragment doesn't tell you (figure 1).</text></svg>