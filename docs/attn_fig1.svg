<svg viewBox="0 0 940 488" role="img" aria-label="A row of twelve scores processed in three chunks of four. The running max and sum are updated per chunk; when the max rises at chunk 1 the sum is multiplied by exp(old max minus new max). The final (m, l) equals the two-pass result." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="940" height="488" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="34" class="m bold" text-anchor="start" font-size="12" >one row of 12 scores, processed in 3 chunks of Bc = 4</text><rect x="130" y="58" width="46" height="30" rx="0" class="fa3 f4" /><text x="153.0" y="78" class="m bold" text-anchor="middle" font-size="13" >1</text><text x="153.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s0</text><rect x="176" y="58" width="46" height="30" rx="0" class="fa3 f4" /><text x="199.0" y="78" class="m bold" text-anchor="middle" font-size="13" >3</text><text x="199.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s1</text><rect x="222" y="58" width="46" height="30" rx="0" class="fa3 f4" /><text x="245.0" y="78" class="m bold" text-anchor="middle" font-size="13" >2</text><text x="245.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s2</text><rect x="268" y="58" width="46" height="30" rx="0" class="fa3 f4" /><text x="291.0" y="78" class="m bold" text-anchor="middle" font-size="13" >0</text><text x="291.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s3</text><rect x="314" y="58" width="46" height="30" rx="0" class="fb3 f4" /><text x="337.0" y="78" class="m bold" text-anchor="middle" font-size="13" >5</text><text x="337.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s4</text><rect x="360" y="58" width="46" height="30" rx="0" class="fb3 f4" /><text x="383.0" y="78" class="m bold" text-anchor="middle" font-size="13" >1</text><text x="383.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s5</text><rect x="406" y="58" width="46" height="30" rx="0" class="fb3 f4" /><text x="429.0" y="78" class="m bold" text-anchor="middle" font-size="13" >4</text><text x="429.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s6</text><rect x="452" y="58" width="46" height="30" rx="0" class="fb3 f4" /><text x="475.0" y="78" class="m bold" text-anchor="middle" font-size="13" >2</text><text x="475.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s7</text><rect x="498" y="58" width="46" height="30" rx="0" class="fc3 f4" /><text x="521.0" y="78" class="m bold" text-anchor="middle" font-size="13" >3</text><text x="521.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s8</text><rect x="544" y="58" width="46" height="30" rx="0" class="fc3 f4" /><text x="567.0" y="78" class="m bold" text-anchor="middle" font-size="13" >3</text><text x="567.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s9</text><rect x="590" y="58" width="46" height="30" rx="0" class="fc3 f4" /><text x="613.0" y="78" class="m bold" text-anchor="middle" font-size="13" >1</text><text x="613.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s10</text><rect x="636" y="58" width="46" height="30" rx="0" class="fc3 f4" /><text x="659.0" y="78" class="m bold" text-anchor="middle" font-size="13" >2</text><text x="659.0" y="100" class="m mut" text-anchor="middle" font-size="8" >s11</text><text x="222.0" y="50" class="m" text-anchor="middle" font-size="10" >chunk 0</text><text x="406.0" y="50" class="m" text-anchor="middle" font-size="10" >chunk 1</text><text x="590.0" y="50" class="m" text-anchor="middle" font-size="10" >chunk 2</text><text x="122" y="78" class="m mut" text-anchor="end" font-size="11" >s =</text><rect x="40" y="132" width="262" height="232" rx="4" class="cellb" /><text x="50" y="152" class="m bold" text-anchor="start" font-size="12" >chunk 0</text><text x="292" y="152" class="m mut" text-anchor="end" font-size="9" >nothing to rescale yet</text><text x="50" y="174" class="m mut" text-anchor="start" font-size="10" >in:   m = -inf    l = 0.000</text><text x="50" y="195" class="m " text-anchor="start" font-size="10" >chunk max = 3</text><text x="50" y="216" class="m " text-anchor="start" font-size="10" >m_new = max(m, 3) = 3</text><text x="50" y="237" class="m " text-anchor="start" font-size="10" >alpha = exp(m - m_new) = exp(-inf) = 0</text><text x="50" y="258" class="m mut" text-anchor="start" font-size="10" >chunk sum = e^-2 + e^0 + e^-1 + e^-3</text><text x="50" y="279" class="m " text-anchor="start" font-size="10" >          = 1.553</text><text x="50" y="300" class="m " text-anchor="start" font-size="10" >l = l*alpha + chunk sum</text><text x="50" y="321" class="m " text-anchor="start" font-size="10" >  = 0.000 * 0.000 + 1.553 = 1.553</text><text x="50" y="342" class="m mut" text-anchor="start" font-size="10" >out:  m = 3    l = 1.553</text><line x1="306" y1="248.0" x2="335" y2="248.0" class="ln" marker-end="url(#ar21)" /><text x="320.5" y="240.0" class="m mut" text-anchor="middle" font-size="9" >(m, l)</text><rect x="339" y="132" width="262" height="232" rx="4" class="hlrow" /><rect x="339" y="132" width="262" height="232" rx="4" class="cellb" /><text x="349" y="152" class="m bold" text-anchor="start" font-size="12" >chunk 1</text><text x="591" y="152" class="m mut" text-anchor="end" font-size="9" >the rescale event</text><text x="349" y="174" class="m mut" text-anchor="start" font-size="10" >in:   m = 3    l = 1.553</text><text x="349" y="195" class="m " text-anchor="start" font-size="10" >chunk max = 5</text><text x="349" y="216" class="m " text-anchor="start" font-size="10" >m_new = max(m, 5) = 5</text><text x="349" y="237" class="m bold" text-anchor="start" font-size="10" >alpha = exp(3 - 5) = 0.135</text><text x="349" y="258" class="m mut" text-anchor="start" font-size="10" >chunk sum = e^0 + e^-4 + e^-1 + e^-3</text><text x="349" y="279" class="m " text-anchor="start" font-size="10" >          = 1.436</text><text x="349" y="300" class="m " text-anchor="start" font-size="10" >l = l*alpha + chunk sum</text><text x="349" y="321" class="m bold" text-anchor="start" font-size="10" >  = 1.553 * 0.135 + 1.436 = 1.646</text><text x="349" y="342" class="m mut" text-anchor="start" font-size="10" >out:  m = 5    l = 1.646</text><line x1="605" y1="248.0" x2="634" y2="248.0" class="ln" marker-end="url(#ar21)" /><text x="619.5" y="240.0" class="m mut" text-anchor="middle" font-size="9" >(m, l)</text><rect x="638" y="132" width="262" height="232" rx="4" class="cellb" /><text x="648" y="152" class="m bold" text-anchor="start" font-size="12" >chunk 2</text><text x="890" y="152" class="m mut" text-anchor="end" font-size="9" >max unchanged</text><text x="648" y="174" class="m mut" text-anchor="start" font-size="10" >in:   m = 5    l = 1.646</text><text x="648" y="195" class="m " text-anchor="start" font-size="10" >chunk max = 3</text><text x="648" y="216" class="m " text-anchor="start" font-size="10" >m_new = max(m, 3) = 5</text><text x="648" y="237" class="m " text-anchor="start" font-size="10" >alpha = exp(5 - 5) = 1.000</text><text x="648" y="258" class="m mut" text-anchor="start" font-size="10" >chunk sum = e^-2 + e^-2 + e^-4 + e^-3</text><text x="648" y="279" class="m " text-anchor="start" font-size="10" >          = 0.339</text><text x="648" y="300" class="m " text-anchor="start" font-size="10" >l = l*alpha + chunk sum</text><text x="648" y="321" class="m " text-anchor="start" font-size="10" >  = 1.646 * 1.000 + 0.339 = 1.985</text><text x="648" y="342" class="m mut" text-anchor="start" font-size="10" >out:  m = 5    l = 1.985</text><line x1="40" y1="384" x2="900" y2="384" class="tick" /><text x="40" y="404" class="m bold" text-anchor="start" font-size="11" >two-pass softmax on the same row:</text><text x="40" y="424" class="m" text-anchor="start" font-size="11" >m = max(all 12) = 5       l = sum exp(s - 5) over all 12 = 1.985</text><text x="40" y="444" class="m bold" text-anchor="start" font-size="11" >online result after chunk 2:   m = 5   l = 1.985     -&gt;   identical</text><text x="40" y="470" class="m mut" text-anchor="start" font-size="10" >finish: p_j = exp(s_j - m) / l  -- in attention this is O = o / l, one divide per output, no pass over the row.</text></svg>