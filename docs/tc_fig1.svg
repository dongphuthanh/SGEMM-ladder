<svg viewBox="0 0 1000 574" role="img" aria-label="Left: a normal kernel, where one thread holds an 8 by 8 output tile in registers and does 64 FFMA per k step, one multiply-add per lane per instruction. Right: a tensor core, where the whole warp issues one mma_sync computing a 16 by 16 by 8 product, 2048 multiply-adds, and each lane holds 8 of the 256 outputs in an unspecified pattern. Bottom: fragments can be loaded, stored, used in mma, or have one operation applied to every element, but cannot be addressed by row and column." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar31" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="1000" height="574" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="26" class="m bold" text-anchor="start" font-size="13" >the unit of work: one thread (normal kernel) vs one warp (tensor core)</text><text x="30" y="58" class="m bold" text-anchor="start" font-size="11" >normal kernel: each thread runs its own FFMAs</text><rect x="40" y="110" width="18" height="18" rx="0" class="fc2 cell" /><rect x="80" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="128" width="18" height="18" rx="0" class="fc2 cell" /><rect x="98" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="146" width="18" height="18" rx="0" class="fc2 cell" /><rect x="116" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="164" width="18" height="18" rx="0" class="fc2 cell" /><rect x="134" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="182" width="18" height="18" rx="0" class="fc2 cell" /><rect x="152" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="200" width="18" height="18" rx="0" class="fc2 cell" /><rect x="170" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="218" width="18" height="18" rx="0" class="fc2 cell" /><rect x="188" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="236" width="18" height="18" rx="0" class="fc2 cell" /><rect x="206" y="84" width="18" height="18" rx="0" class="fb2 cell" /><rect x="40" y="110" width="18" height="144" rx="0" class="box" /><rect x="80" y="84" width="144" height="18" rx="0" class="box" /><rect x="80" y="110" width="144" height="144" rx="0" class="fa1" /><line x1="80" y1="128" x2="224" y2="128" class="cell" /><line x1="80" y1="146" x2="224" y2="146" class="cell" /><line x1="80" y1="164" x2="224" y2="164" class="cell" /><line x1="80" y1="182" x2="224" y2="182" class="cell" /><line x1="80" y1="200" x2="224" y2="200" class="cell" /><line x1="80" y1="218" x2="224" y2="218" class="cell" /><line x1="80" y1="236" x2="224" y2="236" class="cell" /><line x1="98" y1="110" x2="98" y2="254" class="cell" /><line x1="116" y1="110" x2="116" y2="254" class="cell" /><line x1="134" y1="110" x2="134" y2="254" class="cell" /><line x1="152" y1="110" x2="152" y2="254" class="cell" /><line x1="170" y1="110" x2="170" y2="254" class="cell" /><line x1="188" y1="110" x2="188" y2="254" class="cell" /><line x1="206" y1="110" x2="206" y2="254" class="cell" /><rect x="80" y="110" width="144" height="144" rx="0" class="box" /><text x="49.0" y="268" class="m bold" text-anchor="middle" font-size="10" >a[8]</text><text x="152" y="78" class="m bold" text-anchor="middle" font-size="10" >b[8]</text><text x="152" y="268" class="m bold" text-anchor="middle" font-size="10" >c[8][8]  (one thread)</text><text x="262" y="96" class="m bold" text-anchor="start" font-size="10" >per k step, per thread:</text><text x="262" y="112" class="m " text-anchor="start" font-size="10" >  64 FFMA:  c[i][j] += a[i]*b[j]</text><text x="262" y="128" class="m " text-anchor="start" font-size="10" ></text><text x="262" y="144" class="m " text-anchor="start" font-size="10" >thread t owns exactly these 64</text><text x="262" y="160" class="m " text-anchor="start" font-size="10" >outputs: rows ty*8..+7,</text><text x="262" y="176" class="m " text-anchor="start" font-size="10" >cols tx*8..+7 -- you chose</text><text x="262" y="192" class="m " text-anchor="start" font-size="10" >that mapping, and you can</text><text x="262" y="208" class="m " text-anchor="start" font-size="10" >index c[i][j] however you like</text><text x="262" y="224" class="m " text-anchor="start" font-size="10" ></text><text x="262" y="240" class="m bold" text-anchor="start" font-size="10" >1 FFMA instruction for a warp</text><text x="262" y="256" class="m bold" text-anchor="start" font-size="10" >  = 32 multiply-adds (1 per lane)</text><line x1="500" y1="44" x2="500" y2="410" class="tick" /><text x="520" y="58" class="m bold" text-anchor="start" font-size="11" >tensor core: the whole warp issues one mma_sync</text><rect x="530" y="196" width="96" height="192" rx="0" class="fc2" /><line x1="530" y1="208" x2="626" y2="208" class="cell" /><line x1="530" y1="220" x2="626" y2="220" class="cell" /><line x1="530" y1="232" x2="626" y2="232" class="cell" /><line x1="530" y1="244" x2="626" y2="244" class="cell" /><line x1="530" y1="256" x2="626" y2="256" class="cell" /><line x1="530" y1="268" x2="626" y2="268" class="cell" /><line x1="530" y1="280" x2="626" y2="280" class="cell" /><line x1="530" y1="292" x2="626" y2="292" class="cell" /><line x1="530" y1="304" x2="626" y2="304" class="cell" /><line x1="530" y1="316" x2="626" y2="316" class="cell" /><line x1="530" y1="328" x2="626" y2="328" class="cell" /><line x1="530" y1="340" x2="626" y2="340" class="cell" /><line x1="530" y1="352" x2="626" y2="352" class="cell" /><line x1="530" y1="364" x2="626" y2="364" class="cell" /><line x1="530" y1="376" x2="626" y2="376" class="cell" /><line x1="542" y1="196" x2="542" y2="388" class="cell" /><line x1="554" y1="196" x2="554" y2="388" class="cell" /><line x1="566" y1="196" x2="566" y2="388" class="cell" /><line x1="578" y1="196" x2="578" y2="388" class="cell" /><line x1="590" y1="196" x2="590" y2="388" class="cell" /><line x1="602" y1="196" x2="602" y2="388" class="cell" /><line x1="614" y1="196" x2="614" y2="388" class="cell" /><rect x="530" y="196" width="96" height="192" rx="0" class="box" /><rect x="640" y="90" width="192" height="96" rx="0" class="fb2" /><line x1="640" y1="102" x2="832" y2="102" class="cell" /><line x1="640" y1="114" x2="832" y2="114" class="cell" /><line x1="640" y1="126" x2="832" y2="126" class="cell" /><line x1="640" y1="138" x2="832" y2="138" class="cell" /><line x1="640" y1="150" x2="832" y2="150" class="cell" /><line x1="640" y1="162" x2="832" y2="162" class="cell" /><line x1="640" y1="174" x2="832" y2="174" class="cell" /><line x1="652" y1="90" x2="652" y2="186" class="cell" /><line x1="664" y1="90" x2="664" y2="186" class="cell" /><line x1="676" y1="90" x2="676" y2="186" class="cell" /><line x1="688" y1="90" x2="688" y2="186" class="cell" /><line x1="700" y1="90" x2="700" y2="186" class="cell" /><line x1="712" y1="90" x2="712" y2="186" class="cell" /><line x1="724" y1="90" x2="724" y2="186" class="cell" /><line x1="736" y1="90" x2="736" y2="186" class="cell" /><line x1="748" y1="90" x2="748" y2="186" class="cell" /><line x1="760" y1="90" x2="760" y2="186" class="cell" /><line x1="772" y1="90" x2="772" y2="186" class="cell" /><line x1="784" y1="90" x2="784" y2="186" class="cell" /><line x1="796" y1="90" x2="796" y2="186" class="cell" /><line x1="808" y1="90" x2="808" y2="186" class="cell" /><line x1="820" y1="90" x2="820" y2="186" class="cell" /><rect x="640" y="90" width="192" height="96" rx="0" class="box" /><rect x="640" y="196" width="192" height="192" rx="0" class="fa3" /><rect x="664" y="208" width="12" height="12" rx="0" class="fa1" /><rect x="676" y="208" width="12" height="12" rx="0" class="fa1" /><rect x="664" y="304" width="12" height="12" rx="0" class="fa1" /><rect x="676" y="304" width="12" height="12" rx="0" class="fa1" /><rect x="760" y="208" width="12" height="12" rx="0" class="fa1" /><rect x="772" y="208" width="12" height="12" rx="0" class="fa1" /><rect x="760" y="304" width="12" height="12" rx="0" class="fa1" /><rect x="772" y="304" width="12" height="12" rx="0" class="fa1" /><line x1="640" y1="208" x2="832" y2="208" class="cell" /><line x1="640" y1="220" x2="832" y2="220" class="cell" /><line x1="640" y1="232" x2="832" y2="232" class="cell" /><line x1="640" y1="244" x2="832" y2="244" class="cell" /><line x1="640" y1="256" x2="832" y2="256" class="cell" /><line x1="640" y1="268" x2="832" y2="268" class="cell" /><line x1="640" y1="280" x2="832" y2="280" class="cell" /><line x1="640" y1="292" x2="832" y2="292" class="cell" /><line x1="640" y1="304" x2="832" y2="304" class="cell" /><line x1="640" y1="316" x2="832" y2="316" class="cell" /><line x1="640" y1="328" x2="832" y2="328" class="cell" /><line x1="640" y1="340" x2="832" y2="340" class="cell" /><line x1="640" y1="352" x2="832" y2="352" class="cell" /><line x1="640" y1="364" x2="832" y2="364" class="cell" /><line x1="640" y1="376" x2="832" y2="376" class="cell" /><line x1="652" y1="196" x2="652" y2="388" class="cell" /><line x1="664" y1="196" x2="664" y2="388" class="cell" /><line x1="676" y1="196" x2="676" y2="388" class="cell" /><line x1="688" y1="196" x2="688" y2="388" class="cell" /><line x1="700" y1="196" x2="700" y2="388" class="cell" /><line x1="712" y1="196" x2="712" y2="388" class="cell" /><line x1="724" y1="196" x2="724" y2="388" class="cell" /><line x1="736" y1="196" x2="736" y2="388" class="cell" /><line x1="748" y1="196" x2="748" y2="388" class="cell" /><line x1="760" y1="196" x2="760" y2="388" class="cell" /><line x1="772" y1="196" x2="772" y2="388" class="cell" /><line x1="784" y1="196" x2="784" y2="388" class="cell" /><line x1="796" y1="196" x2="796" y2="388" class="cell" /><line x1="808" y1="196" x2="808" y2="388" class="cell" /><line x1="820" y1="196" x2="820" y2="388" class="cell" /><rect x="640" y="196" width="192" height="192" rx="0" class="box" /><text x="578" y="188" class="m bold" text-anchor="middle" font-size="10" >a: 16x8</text><text x="840" y="130" class="m bold" text-anchor="start" font-size="10" >b: 8x16</text><text x="736" y="403" class="m bold" text-anchor="middle" font-size="10" >c: 16x16 accumulator</text><text x="842" y="210" class="m " text-anchor="start" font-size="10" >256 floats spread</text><text x="842" y="225" class="m " text-anchor="start" font-size="10" >over 32 lanes =</text><text x="842" y="240" class="m " text-anchor="start" font-size="10" >8 per lane</text><text x="842" y="255" class="m " text-anchor="start" font-size="10" ></text><text x="842" y="270" class="m bold" text-anchor="start" font-size="10" >dark = the 8 that</text><text x="842" y="285" class="m bold" text-anchor="start" font-size="10" >one lane holds.</text><text x="842" y="300" class="m " text-anchor="start" font-size="10" >which 8 is not</text><text x="842" y="315" class="m " text-anchor="start" font-size="10" >specified by WMMA</text><text x="520" y="432" class="m bold" text-anchor="start" font-size="10" >1 mma_sync = 16 x 16 x 8 = 2,048 multiply-adds,</text><text x="520" y="448" class="m bold" text-anchor="start" font-size="10" >issued by all 32 lanes together (64x the work of one FFMA instruction)</text><text x="30" y="432" class="m" text-anchor="start" font-size="10" >you address single elements; the hardware does</text><text x="30" y="448" class="m" text-anchor="start" font-size="10" >one multiply-add per lane per instruction</text><line x1="20" y1="466" x2="990" y2="466" class="tick" /><text x="30" y="486" class="m bold" text-anchor="start" font-size="11" >a fragment CAN:</text><text x="30" y="504" class="m" text-anchor="start" font-size="10" >- be filled, loaded from and stored to memory (load/store_matrix_sync)</text><text x="30" y="520" class="m" text-anchor="start" font-size="10" >- be an operand of mma_sync</text><text x="30" y="536" class="m" text-anchor="start" font-size="10" >- have the SAME operation applied to every element: x[t] *= 0.5f, x[t] = to_tf32(x[t])</text><text x="560" y="486" class="m bold" text-anchor="start" font-size="11" >a fragment CAN'T (it doesn't know rows):</text><text x="560" y="504" class="m" text-anchor="start" font-size="10" >- give you element (r, c)</text><text x="560" y="520" class="m" text-anchor="start" font-size="10" >- take a row max or row sum</text><text x="560" y="536" class="m" text-anchor="start" font-size="10" >- scale row r by its own alpha[r]</text><text x="560" y="552" class="m bold" text-anchor="start" font-size="10" >- -&gt; for those: store it to shared memory first</text></svg>