"26" height="16" rx="0" class="fb3 f4" /><text x="135.0" y="183" class="m " text-anchor="middle" font-size="8" >t226</text><rect x="148" y="172" width="26" height="16" rx="0" class="fb3 f4" /><text x="161.0" y="183" class="m " text-anchor="middle" font-size="8" >t227</text><rect x="196" y="172" width="26" height="16" rx="0" class="fb3 f4" /><text x="209.0" y="183" class="m " text-anchor="middle" font-size="8" >t254</text><rect x="222" y="172" width="26" height="16" rx="0" class="fb3 f4" /><text x="235.0" y="183" class="m " text-anchor="middle" font-size="8" >t255</text><text x="159.0" y="206" class="m" text-anchor="middle" font-size="10" >32 float4 per row  -&gt;  32 threads per row, 8 rows  =  256 threads, one pass</text><text x="159.0" y="220" class="m mut" text-anchor="middle" font-size="10" >innerRowB = t / 32      innerColB = (t % 32) * 4</text><text x="560" y="70" class="m bold" text-anchor="start" font-size="12" >no transpose needed</text><text x="560" y="88" class="m" text-anchor="start" font-size="10" >B's contiguous axis is already</text><text x="560" y="101" class="m" text-anchor="start" font-size="10" >the C-column axis, so the tile</text><text x="560" y="114" class="m" text-anchor="start" font-size="10" >is k-major as loaded.</text><text x="560" y="138" class="m mut" text-anchor="start" font-size="10" >one 128-bit load, one 128-bit</text><text x="560" y="151" class="m mut" text-anchor="start" font-size="10" >store, thread t0 -&gt; Bs[0][0..3]</text><text x="560" y="175" class="m mut" text-anchor="start" font-size="10" >a warp (t0..t31) fills a whole</text><text x="560" y="188" class="m mut" text-anchor="start" font-size="10" >row: 512 contiguous bytes of B</text></svg>