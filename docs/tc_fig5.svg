<svg viewBox="0 0 1000 526" role="img" aria-label="Left: in warptiling.cu a warp's 64 by 32 block of C is split into 32 fixed 8 by 8 tiles, one per lane, each computed with 64 FFMA per k. Right: in tc_gemm.cu the same 64 by 32 block is 8 accumulator fragments of 16 by 16, each spread over all 32 lanes, computed with 8 mma_sync per 8-deep k step. Table: both do 16384 multiply-adds per 8-deep k step, read 768 floats from shared memory and hold 64 accumulator registers per lane; the SIMT version issues 512 FFMA, the tensor-core version 8 mma_sync." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="1000" height="526" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="26" class="m bold" text-anchor="start" font-size="13" >GEMM: what one warp computes, before (warptiling.cu) and after (tc_gemm.cu)</text><text x="20" y="44" class="m mut" text-anchor="start" font-size="10" >same block tile 128x128, same 8 warps as 2x4, same warp tile: a 64x32 block of C.  Only the split inside the warp changes.</text><text x="70" y="90" class="m bold" text-anchor="start" font-size="11" >before: 32 lanes x their own 8x8</text><rect x="70" y="110" width="32" height="32" rx="0" class="fa3" /><text x="86" y="130" class="m" text-anchor="middle" font-size="9" >0</text><rect x="102" y="110" width="32" height="32" rx="0" class="fa3" /><text x="118" y="130" class="m" text-anchor="middle" font-size="9" >1</text><rect x="134" y="110" width="32" height="32" rx="0" class="fa3" /><text x="150" y="130" class="m" text-anchor="middle" font-size="9" >2</text><rect x="166" y="110" width="32" height="32" rx="0" class="fa3" /><text x="182" y="130" class="m" text-anchor="middle" font-size="9" >3</text><rect x="70" y="142" width="32" height="32" rx="0" class="fa3" /><text x="86" y="162" class="m" text-anchor="middle" font-size="9" >4</text><rect x="102" y="142" width="32" height="32" rx="0" class="fa3" /><text x="118" y="162" class="m" text-anchor="middle" font-size="9" >5</text><rect x="134" y="142" width="32" height="32" rx="0" class="fa3" /><text x="150" y="162" class="m" text-anchor="middle" font-size="9" >6</text><rect x="166" y="142" width="32" height="32" rx="0" class="fa3" /><text x="182" y="162" class="m" text-anchor="middle" font-size="9" >7</text><rect x="70" y="174" width="32" height="32" rx="0" class="fa3" /><text x="86" y="194" class="m" text-anchor="middle" font-size="9" >8</text><rect x="102" y="174" width="32" height="32" rx="0" class="fa3" /><text x="118" y="194" class="m" text-anchor="middle" font-size="9" >9</text><rect x="134" y="174" width="32" height="32" rx="0" class="fa3" /><text x="150" y="194" class="m" text-anchor="middle" font-size="9" >10</text><rect x="166" y="174" width="32" height="32" rx="0" class="fa3" /><text x="182" y="194" class="m" text-anchor="middle" font-size="9" >11</text><rect x="70" y="206" width="32" height="32" rx="0" class="fa3" /><text x="86" y="226" class="m" text-anchor="middle" font-size="9" >12</text><rect x="102" y="206" width="32" height="32" rx="0" class="fa1" /><text x="118" y="226" class="m bold" text-anchor="middle" font-size="9" >13</text><rect x="134" y="206" width="32" height="32" rx="0" class="fa3" /><text x="150" y="226" class="m" text-anchor="middle" font-size="9" >14</text><rect x="166" y="206" width="32" height="32" rx="0" class="fa3" /><text x="182" y="226" class="m" text-anchor="middle" font-size="9" >15</text><rect x="70" y="238" width="32" height="32" rx="0" class="fa3" /><text x="86" y="258" class="m" text-anchor="middle" font-size="9" >16</text><rect x="102" y="238" width="32" height="32" rx="0" class="fa3" /><text x="118" y="258" class="m" text-anchor="middle" font-size="9" >17</text><rect x="134" y="238" width="32" height="32" rx="0" class="fa3" /><text x="150" y="258" class="m" text-anchor="middle" font-size="9" >18</text><rect x="166" y="238" width="32" height="32" rx="0" class="fa3" /><text x="182" y="258" class="m" text-anchor="middle" font-size="9" >19</text><rect x="70" y="270" width="32" height="32" rx="0" class="fa3" /><text x="86" y="290" class="m" text-anchor="middle" font-size="9" >20</text><rect x="102" y="270" width="32" height="32" rx="0" class="fa3" /><text x="118" y="290" class="m" text-anchor="middle" font-size="9" >21</text><rect x="134" y="270" width="32" height="32" rx="0" class="fa3" /><text x="150" y="290" class="m" text-anchor="middle" font-size="9" >22</text><rect x="166" y="270" width="32" height="32" rx="0" class="fa3" /><text x="182" y="290" class="m" text-anchor="middle" font-size="9" >23</text><rect x="70" y="302" width="32" height="32" rx="0" class="fa3" /><text x="86" y="322" class="m" text-anchor="middle" font-size="9" >24</text><rect x="102" y="302" width="32" height="32" rx="0" class="fa3" /><text x="118" y="322" class="m" text-anchor="middle" font-size="9" >25</text><rect x="134" y="302" width="32" height="32" rx="0" class="fa3" /><text x="150" y="322" class="m" text-anchor="middle" font-size="9" >26</text><rect x="166" y="302" width="32" height="32" rx="0" class="fa3" /><text x="182" y="322" class="m" text-anchor="middle" font-size="9" >27</text><rect x="70" y="334" width="32" height="32" rx="0" class="fa3" /><text x="86" y="354" class="m" text-anchor="middle" font-size="9" >28</text><rect x="102" y="334" width="32" height="32" rx="0" class="fa3" /><text x="118" y="354" class="m" text-anchor="middle" font-size="9" >29</text><rect x="134" y="334" width="32" height="32" rx="0" class="fa3" /><text x="150" y="354" class="m" text-anchor="middle" font-size="9" >30</text><rect x="166" y="334" width="32" height="32" rx="0" class="fa3" /><text x="182" y="354" class="m" text-anchor="middle" font-size="9" >31</text><line x1="70" y1="142" x2="198" y2="142" class="tick" /><line x1="70" y1="174" x2="198" y2="174" class="tick" /><line x1="70" y1="206" x2="198" y2="206" class="tick" /><line x1="70" y1="238" x2="198" y2="238" class="tick" /><line x1="70" y1="270" x2="198" y2="270" class="tick" /><line x1="70" y1="302" x2="198" y2="302" class="tick" /><line x1="70" y1="334" x2="198" y2="334" class="tick" /><line x1="102" y1="110" x2="102" y2="366" class="tick" /><line x1="134" y1="110" x2="134" y2="366" class="tick" /><line x1="166" y1="110" x2="166" y2="366" class="tick" /><rect x="70" y="110" width="128" height="256" rx="0" class="box" /><text x="134" y="382" class="m mut" text-anchor="middle" font-size="9" >numbers = lane</text><text x="214" y="120" class="m " text-anchor="start" font-size="10" >lane = laneRow*4 + laneCol</text><text x="214" y="136" class="m " text-anchor="start" font-size="10" >each lane owns a fixed 8x8</text><text x="214" y="152" class="m " text-anchor="start" font-size="10" ></text><text x="214" y="168" class="m bold" text-anchor="start" font-size="10" >lane 13 = laneRow 3, laneCol 1:</text><text x="214" y="184" class="m " text-anchor="start" font-size="10" >  rows warpRow*64 + 24 .. +31</text><text x="214" y="200" class="m " text-anchor="start" font-size="10" >  cols warpCol*32 +  8 .. +15</text><text x="214" y="216" class="m " text-anchor="start" font-size="10" ></text><text x="214" y="232" class="m bold" text-anchor="start" font-size="10" >per k (1 deep), each lane:</text><text x="214" y="248" class="m " text-anchor="start" font-size="10" >  a[8] &lt;- As, b[8] &lt;- Bs</text><text x="214" y="264" class="m " text-anchor="start" font-size="10" >  64 FFMA into c[8][8]</text><line x1="500" y1="80" x2="500" y2="390" class="tick" /><text x="540" y="90" class="m bold" text-anchor="start" font-size="11" >after: the warp as a whole x 8 fragments</text><rect x="540" y="110" width="64" height="64" rx="0" class="fc2 box" /><text x="572" y="146" class="m bold" text-anchor="middle" font-size="10" >acc[0][0]</text><rect x="604" y="110" width="64" height="64" rx="0" class="fc2 box" /><text x="636" y="146" class="m bold" text-anchor="middle" font-size="10" >acc[0][1]</text><rect x="540" y="174" width="64" height="64" rx="0" class="fc2 box" /><text x="572" y="210" class="m bold" text-anchor="middle" font-size="10" >acc[1][0]</text><rect x="604" y="174" width="64" height="64" rx="0" class="fc2 box" /><text x="636" y="210" class="m bold" text-anchor="middle" font-size="10" >acc[1][1]</text><rect x="540" y="238" width="64" height="64" rx="0" class="fc2 box" /><text x="572" y="274" class="m bold" text-anchor="middle" font-size="10" >acc[2][0]</text><rect x="604" y="238" width="64" height="64" rx="0" class="fc2 box" /><text x="636" y="274" class="m bold" text-anchor="middle" font-size="10" >acc[2][1]</text><rect x="540" y="302" width="64" height="64" rx="0" class="fc2 box" /><text x="572" y="338" class="m bold" text-anchor="middle" font-size="10" >acc[3][0]</text><rect x="604" y="302" width="64" height="64" rx="0" class="fc2 box" /><text x="636" y="338" class="m bold" text-anchor="middle" font-size="10" >acc[3][1]</text><text x="604" y="382" class="m mut" text-anchor="middle" font-size="9" >each 16x16, 8 values per lane</text><text x="684" y="120" class="m " text-anchor="start" font-size="10" >no lane owns a region --</text><text x="684" y="136" class="m " text-anchor="start" font-size="10" >all 32 lanes hold 8 values of</text><text x="684" y="152" class="m " text-anchor="start" font-size="10" >EVERY fragment (8 x 8 = 64)</text><text x="684" y="168" class="m " text-anchor="start" font-size="10" ></text><text x="684" y="184" class="m bold" text-anchor="start" font-size="10" >acc[i][j] covers</text><text x="684" y="200" class="m " text-anchor="start" font-size="10" >  rows warpRow*64 + i*16 .. +15</text><text x="684" y="216" class="m " text-anchor="start" font-size="10" >  cols warpCol*32 + j*16 .. +15</text><text x="684" y="232" class="m " text-anchor="start" font-size="10" ></text><text x="684" y="248" class="m bold" text-anchor="start" font-size="10" >per k step (8 deep), the warp:</text><text x="684" y="264" class="m " text-anchor="start" font-size="10" >  4 a + 2 b fragments &lt;- As, Bs</text><text x="684" y="280" class="m " text-anchor="start" font-size="10" >  8 mma_sync</text><line x1="20" y1="396" x2="980" y2="396" class="tick" /><text x="30" y="410" class="m bold" text-anchor="start" font-size="10" >per 8-deep k step, one warp</text><text x="330" y="410" class="m bold" text-anchor="start" font-size="10" >before (SIMT)</text><text x="650" y="410" class="m bold" text-anchor="start" font-size="10" >after (tensor core)</text><text x="30" y="428" class="m " text-anchor="start" font-size="10" >multiply-adds</text><text x="330" y="428" class="m " text-anchor="start" font-size="10" >16,384</text><text x="650" y="428" class="m " text-anchor="start" font-size="10" >16,384</text><text x="30" y="446" class="m " text-anchor="start" font-size="10" >math instructions issued</text><text x="330" y="446" class="m " text-anchor="start" font-size="10" >512 FFMA</text><text x="650" y="446" class="m " text-anchor="start" font-size="10" >8 mma_sync (a few HMMA each)</text><text x="30" y="464" class="m " text-anchor="start" font-size="10" >floats read from shared memory</text><text x="330" y="464" class="m " text-anchor="start" font-size="10" >768  (64 of A + 32 of B, per k)</text><text x="650" y="464" class="m " text-anchor="start" font-size="10" >768  (64x8 of A + 8x32 of B)</text><text x="30" y="482" class="m " text-anchor="start" font-size="10" >accumulator registers per lane</text><text x="330" y="482" class="m " text-anchor="start" font-size="10" >64</text><text x="650" y="482" class="m " text-anchor="start" font-size="10" >64  (8 fragments x 8)</text><text x="30" y="508" class="m bold" text-anchor="start" font-size="10" >Same work, same data, same registers -- the tensor core replaces 512 instructions with 8. Reuse is decided by the warp tile, not by who multiplies.</text></svg>