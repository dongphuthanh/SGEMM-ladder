<svg viewBox="0 0 1120 636" role="img" aria-label="Diagram of one 16-deep slab of the tensor-core GEMM inner loop for warp 6. As holds 128 rows by 16 columns plus 4 padding; warp 6 loads four 16 by 8 A fragments from rows 64 to 127, columns kk to kk+7, with ldm 20. Bs holds 16 rows by 128 columns plus 4 padding; warp 6 loads two 8 by 16 B fragments from rows kk to kk+7, columns 64 to 95, with ldm 132. Eight mma_sync calls add a[i] times b[j] into acc[i][j]. Each value is rounded to TF32 by keeping 10 of 23 mantissa bits. A timeline shows load, barrier, two kk steps, barrier." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="1120" height="636" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="20" y="26" class="m bold" text-anchor="start" font-size="13" >tc_gemm inner loop: one 16-deep slab, seen from warp 6 (warpRow 1, warpCol 2)</text><text x="20" y="44" class="m mut" text-anchor="start" font-size="10" >badges match the code:  1 kk loop   2 load a[i]   3 load b[j]   4 convert to TF32   5 mma_sync   6 __syncthreads</text><text x="40" y="80" class="m bold" text-anchor="start" font-size="11" >As   128 rows x (16 + 4 pad)</text><rect x="110" y="104" width="160" height="256" rx="0" class="cellb" /><rect x="110" y="232" width="128" height="128" rx="0" class="fc3" /><rect x="238" y="104" width="32" height="256" rx="0" class="on1" /><rect x="110" y="232" width="64" height="32" rx="0" class="fc2 box" /><text x="142" y="252" class="m bold" text-anchor="middle" font-size="10" >a[0]</text><rect x="110" y="264" width="64" height="32" rx="0" class="fc2 box" /><text x="142" y="284" class="m bold" text-anchor="middle" font-size="10" >a[1]</text><rect x="110" y="296" width="64" height="32" rx="0" class="fc2 box" /><text x="142" y="316" class="m bold" text-anchor="middle" font-size="10" >a[2]</text><rect x="110" y="328" width="64" height="32" rx="0" class="fc2 box" /><text x="142" y="348" class="m bold" text-anchor="middle" font-size="10" >a[3]</text><rect x="174" y="232" width="64" height="128" rx="0" class="ln2" fill="none"/><line x1="174" y1="104" x2="174" y2="360" class="ln2" /><rect x="110" y="104" width="160" height="256" rx="0" class="box" /><text x="142" y="98" class="m" text-anchor="middle" font-size="9" >kk=0</text><text x="206" y="98" class="m" text-anchor="middle" font-size="9" >kk=8</text><text x="254" y="98" class="m mut" text-anchor="middle" font-size="9" >pad</text><circle cx="96" cy="94" r="9" class="m"/><text x="96" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">1</text><text x="102" y="292" class="m bold" text-anchor="end" font-size="10" >warp 6</text><text x="102" y="306" class="m" text-anchor="end" font-size="10" >rows</text><text x="102" y="320" class="m" text-anchor="end" font-size="10" >64-127</text><text x="102" y="134" class="m mut" text-anchor="end" font-size="9" >other</text><text x="102" y="147" class="m mut" text-anchor="end" font-size="9" >warps</text><text x="102" y="160" class="m mut" text-anchor="end" font-size="9" >rows</text><circle cx="110" cy="232" r="3.5" class="m"/><line x1="126" y1="216" x2="113" y2="229" class="ln" marker-end="url(#ar36)" /><text x="116" y="190" class="m" text-anchor="start" font-size="9" >ptr = &amp;As[64+i*16][kk]</text><text x="116" y="202" class="m mut" text-anchor="start" font-size="9" >(top-left of a[i])</text><line x1="190" y1="374" x2="111" y2="374" class="ln" marker-end="url(#ar36)" /><line x1="190" y1="374" x2="269" y2="374" class="ln" marker-end="url(#ar36)" /><text x="190" y="390" class="m" text-anchor="middle" font-size="9" >ldm = 20: row length incl. pad</text><circle cx="40" cy="412" r="9" class="m"/><text x="40" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">2</text><text x="56" y="416" class="m" text-anchor="start" font-size="9.5" >a[i]: rows 64+16i..+15, cols kk..kk+7</text><text x="390" y="80" class="m bold" text-anchor="start" font-size="11" >Bs   16 rows x (128 + 4 pad)</text><rect x="400" y="104" width="264" height="128" rx="0" class="cellb" /><rect x="528" y="104" width="64" height="128" rx="0" class="fb3" /><rect x="656" y="104" width="8" height="128" rx="0" class="on1" /><rect x="528" y="104" width="32" height="64" rx="0" class="fb2 box" /><text x="544" y="140" class="m bold" text-anchor="middle" font-size="9" >b[0]</text><rect x="560" y="104" width="32" height="64" rx="0" class="fb2 box" /><text x="576" y="140" class="m bold" text-anchor="middle" font-size="9" >b[1]</text><rect x="528" y="168" width="64" height="64" rx="0" class="ln2" fill="none"/><line x1="400" y1="168" x2="664" y2="168" class="ln2" /><rect x="400" y="104" width="264" height="128" rx="0" class="box" /><text x="670" y="140" class="m" text-anchor="start" font-size="9" >kk=0</text><text x="670" y="204" class="m" text-anchor="start" font-size="9" >kk=8</text><text x="560" y="246" class="m bold" text-anchor="middle" font-size="9" >warp 6: cols 64-95</text><line x1="532" y1="262" x2="401" y2="262" class="ln" marker-end="url(#ar36)" /><line x1="532" y1="262" x2="663" y2="262" class="ln" marker-end="url(#ar36)" /><text x="532" y="278" class="m" text-anchor="middle" font-size="9" >ldm = 132: row length incl. pad</text><circle cx="390" cy="302" r="9" class="m"/><text x="390" y="306" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">3</text><text x="406" y="306" class="m" text-anchor="start" font-size="9.5" >b[j]: rows kk..kk+7, cols 64+16j..+15</text><text x="390" y="332" class="m" text-anchor="start" font-size="9.5" >each load_matrix_sync: all 32 lanes</text><text x="390" y="346" class="m" text-anchor="start" font-size="9.5" >together; each lane receives 4 of</text><text x="390" y="360" class="m" text-anchor="start" font-size="9.5" >the tile's 128 values</text><circle cx="730" cy="76" r="9" class="m"/><text x="730" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">5</text><text x="746" y="80" class="m bold" text-anchor="start" font-size="11" >8 x mma_sync:  acc[i][j] += a[i] . b[j]</text><rect x="790.0" y="106.0" width="56.0" height="28.0" rx="0" class="fb2 box" /><text x="818.0" y="124.0" class="m bold" text-anchor="middle" font-size="9" >b[0]</text><rect x="846.0" y="106.0" width="56.0" height="28.0" rx="0" class="fb1 box" /><text x="874.0" y="124.0" class="m bold" text-anchor="middle" font-size="9" >b[1]</text><rect x="756.0" y="140.0" width="28.0" height="56.0" rx="0" class="fc2 box" /><text x="770.0" y="171.0" class="m bold" text-anchor="middle" font-size="8" >a[0]</text><rect x="790.0" y="140.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="818.0" y="172.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[0][0]</text><rect x="846.0" y="140.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="874.0" y="172.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[0][1]</text><rect x="756.0" y="196.0" width="28.0" height="56.0" rx="0" class="fc2 box" /><text x="770.0" y="227.0" class="m bold" text-anchor="middle" font-size="8" >a[1]</text><rect x="790.0" y="196.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="818.0" y="228.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[1][0]</text><rect x="846.0" y="196.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="874.0" y="228.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[1][1]</text><rect x="756.0" y="252.0" width="28.0" height="56.0" rx="0" class="fc1 box" /><text x="770.0" y="283.0" class="m bold" text-anchor="middle" font-size="8" >a[2]</text><rect x="790.0" y="252.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="818.0" y="284.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[2][0]</text><rect x="846.0" y="252.0" width="56.0" height="56.0" rx="0" class="fa1 box" /><text x="874.0" y="284.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[2][1]</text><rect x="756.0" y="308.0" width="28.0" height="56.0" rx="0" class="fc2 box" /><text x="770.0" y="339.0" class="m bold" text-anchor="middle" font-size="8" >a[3]</text><rect x="790.0" y="308.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="818.0" y="340.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[3][0]</text><rect x="846.0" y="308.0" width="56.0" height="56.0" rx="0" class="fa2 box" /><text x="874.0" y="340.0" class="m bold" text-anchor="middle" font-size="8.5" >acc[3][1]</text><text x="916.0" y="118" class="m bold" text-anchor="start" font-size="9.5" >one call (dark):</text><text x="916.0" y="132" class="m " text-anchor="start" font-size="9.5" >(16x8) . (8x16) -&gt; 16x16</text><text x="916.0" y="146" class="m " text-anchor="start" font-size="9.5" >= 2,048 multiply-adds</text><text x="916.0" y="160" class="m " text-anchor="start" font-size="9.5" ></text><text x="916.0" y="174" class="m " text-anchor="start" font-size="9.5" >a[i] used by 2 calls</text><text x="916.0" y="188" class="m " text-anchor="start" font-size="9.5" >b[j] used by 4 calls</text><text x="916.0" y="202" class="m " text-anchor="start" font-size="9.5" >-- the outer product,</text><text x="916.0" y="216" class="m " text-anchor="start" font-size="9.5" >   one level up</text><text x="916.0" y="230" class="m " text-anchor="start" font-size="9.5" ></text><text x="916.0" y="244" class="m " text-anchor="start" font-size="9.5" >the 8 calls are</text><text x="916.0" y="258" class="m " text-anchor="start" font-size="9.5" >independent: the tensor</text><text x="916.0" y="272" class="m " text-anchor="start" font-size="9.5" >pipe overlaps them</text><text x="916.0" y="286" class="m " text-anchor="start" font-size="9.5" ></text><text x="916.0" y="300" class="m bold" text-anchor="start" font-size="9.5" >acc stays in registers</text><text x="916.0" y="314" class="m bold" text-anchor="start" font-size="9.5" >for all slabs (64/lane)</text><line x1="20" y1="422" x2="1100" y2="422" class="tick" /><circle cx="30" cy="440" r="9" class="m"/><text x="30" y="444" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">4</text><text x="46" y="444" class="m bold" text-anchor="start" font-size="11" >__float_to_tf32 on every x[t]:  6 fragments x 4 values = 24 per lane per step</text><rect x="60" y="462" width="16" height="20" rx="0" class="fc2 cell" /><rect x="76" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="92" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="108" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="124" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="140" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="156" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="172" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="188" y="462" width="16" height="20" rx="0" class="fb2 cell" /><rect x="204" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="220" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="236" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="252" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="268" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="284" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="300" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="316" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="332" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="348" y="462" width="16" height="20" rx="0" class="fa2 cell" /><rect x="364" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="380" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="396" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="412" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="428" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="444" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="460" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="476" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="492" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="508" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="524" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="540" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="556" y="462" width="16" height="20" rx="0" class="on1 cell" /><rect x="60" y="462" width="512" height="20" rx="0" class="box" /><line x1="364" y1="458" x2="364" y2="486" class="ln" /><text x="68" y="496" class="m" text-anchor="middle" font-size="9" >sign</text><text x="140" y="496" class="m" text-anchor="middle" font-size="9" >exponent (8)</text><text x="284" y="496" class="m" text-anchor="middle" font-size="9" >mantissa: 10 kept</text><text x="468.0" y="496" class="m mut" text-anchor="middle" font-size="9" >13 rounded away</text><text x="620" y="470" class="m" text-anchor="start" font-size="9.5" >still stored as a float; only the low 13 bits change</text><text x="620" y="486" class="m" text-anchor="start" font-size="9.5" >-&gt; results differ from FP32 by ~1e-3 (why the tolerance is relaxed)</text><text x="620" y="502" class="m" text-anchor="start" font-size="9.5" >skipping it: the tensor core ignores those bits (truncates instead of rounding)</text><line x1="20" y1="522" x2="1100" y2="522" class="tick" /><text x="20" y="540" class="m bold" text-anchor="start" font-size="11" >one slab, in time order (the k0 loop runs this K/16 times)</text><rect x="20" y="554" width="200" height="44" rx="4" class="fb2 f4" /><text x="120.0" y="572" class="m bold" text-anchor="middle" font-size="10" >load slab: all 256 threads</text><text x="120.0" y="588" class="m" text-anchor="middle" font-size="9" >float4 -&gt; As, Bs</text><line x1="222" y1="576" x2="236" y2="576" class="ln" marker-end="url(#ar36)" /><rect x="238" y="554" width="120" height="44" rx="4" class="on1 f4" /><text x="298.0" y="572" class="m bold" text-anchor="middle" font-size="10" >__syncthreads</text><text x="298.0" y="588" class="m" text-anchor="middle" font-size="9" >slab complete</text><line x1="360" y1="576" x2="374" y2="576" class="ln" marker-end="url(#ar36)" /><rect x="376" y="554" width="170" height="44" rx="4" class="fc2 f4" /><text x="461.0" y="572" class="m bold" text-anchor="middle" font-size="10" >kk = 0: 2 3 4 5</text><text x="461.0" y="588" class="m" text-anchor="middle" font-size="9" >4 a + 2 b, 8 mma</text><line x1="548" y1="576" x2="562" y2="576" class="ln" marker-end="url(#ar36)" /><rect x="564" y="554" width="170" height="44" rx="4" class="fc2 f4" /><text x="649.0" y="572" class="m bold" text-anchor="middle" font-size="10" >kk = 8: 2 3 4 5</text><text x="649.0" y="588" class="m" text-anchor="middle" font-size="9" >4 a + 2 b, 8 mma</text><line x1="736" y1="576" x2="750" y2="576" class="ln" marker-end="url(#ar36)" /><rect x="752" y="554" width="130" height="44" rx="4" class="on1 f4" /><text x="817.0" y="572" class="m bold" text-anchor="middle" font-size="10" >__syncthreads</text><text x="817.0" y="588" class="m" text-anchor="middle" font-size="9" >done reading</text><circle cx="876" cy="554" r="9" class="m"/><text x="876" y="558" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">6</text><line x1="884" y1="576" x2="898" y2="576" class="ln" marker-end="url(#ar36)" /><rect x="900" y="554" width="120" height="44" rx="4" class="cellb f4" /><text x="960.0" y="572" class="m bold" text-anchor="middle" font-size="10" >next slab ...</text><text x="20" y="620" class="m" text-anchor="start" font-size="10" >6: the next thing the block does is overwrite As and Bs -- no warp may do that while another is still in steps 2 or 3.</text></svg>