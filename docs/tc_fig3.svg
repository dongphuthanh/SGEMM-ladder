>same pointer, same ldm</text><text x="417.0" y="158" class="m" text-anchor="middle" font-size="9" >only the layout flag differs</text><text x="30" y="330" class="m bold" text-anchor="start" font-size="10" >fragment&lt;matrix_b, 16, 16, 8, precision::tf32, col_major&gt; kb;</text><text x="30" y="346" class="m bold" text-anchor="start" font-size="10" >load_matrix_sync(kb, &amp;Ks[n*16][k*8], D + 4);     // keys n*16..+15, dims k*8..+7</text><text x="30" y="370" class="m" text-anchor="start" font-size="10" >col_major tells WMMA "consecutive memory runs down a column", so K^T[k][j] = Ks[j][k] with no data movement.</text><text x="30" y="386" class="m" text-anchor="start" font-size="10" >The SIMT kernel needed a transposed, 8-way bank-conflicted store for this. Here Ks is stored exactly as K is</text><text x="30" y="402" class="m" text-anchor="start" font-size="10" >in global memory -- which is also what cp.async would need later.</text></svg>