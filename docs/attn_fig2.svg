<svg viewBox="0 0 940 400" role="img" aria-label="Terms accumulated under an old max are all too large by the same factor exp(old max minus new max), so both the running sum and the running output vector are corrected by one multiply before the new chunk is added." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/><style>
svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1B1F26}
.m{fill:#1B1F26}.mut{fill:#5E6772}.bold{font-weight:600}.on1{fill:#F4F5F7}
.ln{stroke:#1B1F26;stroke-width:1.2}.ln2{stroke:#1B1F26;stroke-width:1.2;stroke-dasharray:3 3}
.grid{stroke:#DDE1E7;stroke-width:1}.tick{stroke:#C8CDD5;stroke-width:.8}
.box{stroke:#1B1F26;stroke-width:1;fill:none}
.blk{stroke:#5E6772;stroke-width:.9;opacity:.65}.tick2{stroke:#C8CDD5;stroke-width:.9}
.f4{stroke:#1B1F26;stroke-width:1}.cell{stroke:#FFFFFF;stroke-width:.6}.dot{fill:#5E6772}
.fa1{fill:#0E8A8C}.fa2{fill:#8FCFD0}.fa3{fill:#D9EFEF}
.fb1{fill:#C4581C}.fb2{fill:#EDB08A}.fb3{fill:#F8E2D3}
.fc1{fill:#4A56C9}.fc2{fill:#C3C8F0}.fc3{fill:#E6E8F9}
.hlrow{fill:#F6D77A;fill-opacity:.45}.ph{stroke:#FFFFFF;stroke-width:1}.barw{fill:#F6D77A;fill-opacity:.55}
.cellb{stroke:#C8CDD5;stroke-width:1;fill:none}.cellb.fa2{fill:#8FCFD0}.cellb.fb2{fill:#EDB08A}
</style><text x="50" y="40" class="m bold" text-anchor="start" font-size="12" >after chunk 0   (m = 3)</text><text x="50" y="56" class="m mut" text-anchor="start" font-size="9" >terms p_j = exp(s_j - 3), accumulated into l and o</text><line x1="44" y1="275" x2="226" y2="275" class="tick" /><rect x="50" y="258.7597660116065" width="30" height="16.240233988393523" rx="0" class="fa1 ph" /><text x="65.0" y="252.75976601160647" class="m" text-anchor="middle" font-size="9" >0.135</text><text x="65.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=1</text><rect x="94" y="155.0" width="30" height="120.0" rx="0" class="fa1 ph" /><text x="109.0" y="149.0" class="m" text-anchor="middle" font-size="9" >1.000</text><text x="109.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=3</text><rect x="138" y="230.85446705942692" width="30" height="44.14553294057308" rx="0" class="fa1 ph" /><text x="153.0" y="224.85446705942692" class="m" text-anchor="middle" font-size="9" >0.368</text><text x="153.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=2</text><rect x="182" y="269.0255517958563" width="30" height="5.974448204143673" rx="0" class="fa1 ph" /><text x="197.0" y="263.0255517958563" class="m" text-anchor="middle" font-size="9" >0.050</text><text x="197.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=0</text><text x="50" y="315" class="m bold" text-anchor="start" font-size="11" >l = 1.553</text><text x="50" y="333" class="m" text-anchor="start" font-size="10" >o = sum_j p_j * V[j]</text><text x="50" y="349" class="m mut" text-anchor="start" font-size="9" >(every term carries the</text><text x="50" y="363" class="m mut" text-anchor="start" font-size="9" > same factor exp(-3))</text><text x="330" y="40" class="m bold" text-anchor="start" font-size="12" >chunk 1 raises m to 5</text><text x="330" y="56" class="m mut" text-anchor="start" font-size="9" >the same terms should be exp(s_j - 5)</text><line x1="324" y1="275" x2="506" y2="275" class="tick" /><rect x="330" y="258.7597660116065" width="30" height="16.240233988393523" rx="0" class="fa3 ph" /><rect x="330" y="272.8021233333519" width="30" height="2.1978766666481016" rx="0" class="fa1 ph" /><text x="345.0" y="266.8021233333519" class="m" text-anchor="middle" font-size="9" >0.018</text><text x="345.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=1</text><rect x="374" y="155.0" width="30" height="120.0" rx="0" class="fa3 ph" /><rect x="374" y="258.7597660116065" width="30" height="16.240233988393523" rx="0" class="fa1 ph" /><text x="389.0" y="252.75976601160647" class="m" text-anchor="middle" font-size="9" >0.135</text><text x="389.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=3</text><rect x="418" y="230.85446705942692" width="30" height="44.14553294057308" rx="0" class="fa3 ph" /><rect x="418" y="269.0255517958563" width="30" height="5.974448204143673" rx="0" class="fa1 ph" /><text x="433.0" y="263.0255517958563" class="m" text-anchor="middle" font-size="9" >0.050</text><text x="433.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=2</text><rect x="462" y="269.0255517958563" width="30" height="5.974448204143673" rx="0" class="fa3 ph" /><rect x="462" y="274.19144636010975" width="30" height="0.8085536398902561" rx="0" class="fa1 ph" /><text x="477.0" y="268.19144636010975" class="m" text-anchor="middle" font-size="9" >0.007</text><text x="477.0" y="289" class="m mut" text-anchor="middle" font-size="9" >s=0</text><text x="330" y="315" class="m bold" text-anchor="start" font-size="11" >each = old * alpha</text><text x="330" y="333" class="m" text-anchor="start" font-size="10" >alpha = exp(3 - 5) = 0.135, the SAME for every term,</text><text x="330" y="349" class="m" text-anchor="start" font-size="10" >because exp(s - 5) = exp(s - 3) * exp(3 - 5)</text><text x="640" y="40" class="m bold" text-anchor="start" font-size="12" >so: rescale the totals, then add chunk 1</text><text x="640" y="56" class="m mut" text-anchor="start" font-size="9" >no need to revisit any earlier term</text><line x1="634" y1="275" x2="816" y2="275" class="tick" /><rect x="680" y="249.77888750092444" width="60" height="25.221112499075556" rx="0" class="fa1 ph" /><rect x="680" y="77.46102968955961" width="60" height="172.31785781136486" rx="0" class="fb1 ph" /><text x="746" y="266.38944375046225" class="m" text-anchor="start" font-size="10" >old l * alpha = 0.210</text><text x="746" y="167.619958595242" class="m" text-anchor="start" font-size="10" >chunk 1 terms = 1.436</text><text x="710" y="289" class="m bold" text-anchor="middle" font-size="10" >l = 1.646</text><text x="640" y="315" class="m bold" text-anchor="start" font-size="11" >l  &lt;-  l * alpha  +  sum_j exp(s_j - m_new)</text><text x="640" y="333" class="m bold" text-anchor="start" font-size="11" >o  &lt;-  o * alpha  +  sum_j exp(s_j - m_new) * V[j]</text><text x="640" y="351" class="m mut" text-anchor="start" font-size="9" >o is a sum of the same terms times V rows,</text><text x="640" y="365" class="m mut" text-anchor="start" font-size="9" >so the same alpha corrects it too.</text></svg>